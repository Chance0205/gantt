function PctChip({ pct, editable, onChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(String(pct));
  useEffect(() => {setVal(String(pct));}, [pct]);

  const state = pct === 100 ? "done" : pct === 0 ? "queued" : "live";
  const color = state === "done" ? "var(--ok)" : state === "queued" ? "var(--ink-4)" : "var(--ink-2)";

  const commit = () => {
    let n = parseInt(val, 10);
    if (Number.isNaN(n)) n = pct;
    n = Math.max(0, Math.min(100, n));
    setEditing(false);
    if (n !== pct) onChange && onChange(n);
  };

  if (editing && editable) {
    return (
      <input
        type="number" min="0" max="100" step="5"
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") {e.preventDefault();e.currentTarget.blur();} else
          if (e.key === "Escape") {setVal(String(pct));setEditing(false);}
        }}
        onClick={(e) => e.stopPropagation()}
        onMouseDown={(e) => e.stopPropagation()}
        autoFocus
        style={{
          width: 46, fontSize: 11, padding: "2px 4px",
          border: "1px solid var(--accent)", background: "var(--paper)",
          color: "var(--ink)", fontFamily: "IBM Plex Mono, monospace",
          borderRadius: 2, textAlign: "right", outline: "none"
        }} />);


  }

  const label = pct === 100 ? "100" : pct === 0 ? "—" : pct + "";
  return (
    <span
      onClick={(e) => {if (editable) {e.stopPropagation();setEditing(true);}}}
      onMouseDown={(e) => {if (editable) e.stopPropagation();}}
      title={editable ? "Click to edit progress" : undefined}
      className="mono"
      style={{
        fontSize: 10.5, color, letterSpacing: 0.3,
        borderLeft: "1px solid var(--line-2)", paddingLeft: 8, minWidth: 36, textAlign: "right",
        cursor: editable ? "text" : "default",
        userSelect: "none"
      }}>
      {label}{pct > 0 && pct < 100 ? "%" : ""}</span>);

}

function EditableText({ value, onCommit, style, multiline, suggestions }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const [activeIdx, setActiveIdx] = useState(-1);
  useEffect(() => { setVal(value); }, [value]);

  const filtered = (editing && val && suggestions)
    ? suggestions.filter((s) => s !== value && s.toLowerCase().includes(val.toLowerCase())).slice(0, 7)
    : [];

  const commit = (v) => {
    setEditing(false);
    setActiveIdx(-1);
    const trimmed = ((v !== undefined ? v : val) || "").trim();
    if (!trimmed) { setVal(value); return; }
    if (trimmed !== value) onCommit(trimmed);
    else setVal(value);
  };

  if (editing) {
    return (
      <div style={{ position: "relative", width: "100%" }}
        onMouseDown={(e) => e.stopPropagation()}
        onClick={(e) => e.stopPropagation()}>
        <input
          type="text" value={val}
          onChange={(e) => { setVal(e.target.value); setActiveIdx(-1); }}
          onBlur={() => commit()}
          onKeyDown={(e) => {
            if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx((i) => Math.min(i + 1, filtered.length - 1)); }
            else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx((i) => Math.max(i - 1, -1)); }
            else if (e.key === "Enter") {
              e.preventDefault();
              commit(activeIdx >= 0 && filtered[activeIdx] ? filtered[activeIdx] : undefined);
            }
            else if (e.key === "Tab" && filtered.length > 0) {
              e.preventDefault();
              commit(activeIdx >= 0 ? filtered[activeIdx] : filtered[0]);
            }
            else if (e.key === "Escape") { setVal(value); setEditing(false); }
            e.stopPropagation();
          }}
          autoFocus
          style={{
            ...style,
            fontSize: style && style.fontSize ? style.fontSize : 13,
            padding: "1px 4px",
            border: "1px solid var(--accent)", background: "var(--paper)",
            color: "var(--ink)", borderRadius: 2, outline: "none",
            width: "100%", boxSizing: "border-box",
          }}
        />
        {filtered.length > 0 && (
          <div style={{
            position: "absolute", top: "100%", left: 0, zIndex: 200, marginTop: 2,
            background: "var(--paper-2)", border: "1px solid var(--line)",
            borderRadius: 3, boxShadow: "0 8px 20px -6px rgba(0,0,0,0.22)",
            minWidth: "100%", whiteSpace: "nowrap",
          }}>
            {filtered.map((s, i) => (
              <div key={s}
                onMouseDown={(e) => { e.preventDefault(); commit(s); }}
                onMouseEnter={() => setActiveIdx(i)}
                onMouseLeave={() => setActiveIdx(-1)}
                style={{
                  padding: "5px 10px", fontSize: 11.5, cursor: "pointer",
                  fontFamily: "IBM Plex Mono, monospace",
                  background: i === activeIdx ? "var(--ink)" : "transparent",
                  color: i === activeIdx ? "var(--paper)" : "var(--ink-2)",
                }}>{s}</div>
            ))}
          </div>
        )}
      </div>
    );
  }
  return (
    <span
      onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }}
      style={{ ...style, cursor: "text", display: "block" }}
      title="Double-click to edit"
    >{value}</span>
  );
}

function OwnersPicker({ values, onChange }) {
  const { owners: ctxOwners, teams: ctxTeams } = React.useContext(OwnersCtx);
  const [open, setOpen] = useState(false);
  const [dropPos, setDropPos] = useState(null);
  const triggerRef = React.useRef(null);

  const handleToggleOpen = (e) => {
    e.stopPropagation();
    if (!open && triggerRef.current) {
      const rect = triggerRef.current.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const right = window.innerWidth - rect.right;
      if (spaceBelow < 320) {
        setDropPos({ bottom: window.innerHeight - rect.top + 4, right });
      } else {
        setDropPos({ top: rect.bottom + 4, right });
      }
    }
    setOpen((x) => !x);
  };

  const allMembers = ctxTeams.flatMap((t) => t.members).filter((m) => ctxOwners[m]);

  const toggle = (id) => {
    if (values.includes(id)) onChange(values.filter((x) => x !== id));
    else onChange([...values, id]);
  };

  const toggleTeam = (team) => {
    const valid = team.members.filter((m) => ctxOwners[m]);
    const allSel = valid.every((m) => values.includes(m));
    if (allSel) onChange(values.filter((v) => !valid.includes(v)));
    else { const s = new Set(values); valid.forEach((m) => s.add(m)); onChange([...s]); }
  };

  const toggleAll = () => {
    const allSel = allMembers.every((m) => values.includes(m));
    if (allSel) onChange([]);
    else onChange([...allMembers]);
  };

  const visible = values.slice(0, 3);
  const extra = values.length - 3;

  const teamState = (team) => {
    const valid = team.members.filter((m) => ctxOwners[m]);
    const cnt = valid.filter((m) => values.includes(m)).length;
    return cnt === valid.length && cnt > 0 ? "all" : cnt > 0 ? "some" : "none";
  };
  const allState = allMembers.every((m) => values.includes(m)) && allMembers.length > 0 ? "all"
    : allMembers.some((m) => values.includes(m)) ? "some" : "none";

  const displayLabel = (() => {
    if (values.length === 0) return null;
    if (allMembers.length > 0 && values.length === allMembers.length && allMembers.every((m) => values.includes(m))) return "ALL";
    for (const t of ctxTeams) {
      const valid = t.members.filter((m) => ctxOwners[m]);
      if (valid.length > 0 && valid.length === values.length && valid.every((m) => values.includes(m))) return t.name;
    }
    return null;
  })();

  const groupBtnStyle = (state) => ({
    display: "flex", alignItems: "center", gap: 6, width: "100%",
    padding: "5px 8px", border: "none", borderRadius: 2, cursor: "pointer",
    fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, letterSpacing: "0.04em",
    textTransform: "uppercase", textAlign: "left",
    background: state !== "none" ? "rgba(138,58,31,0.10)" : "transparent",
    color: state !== "none" ? "var(--accent)" : "var(--ink-3)",
  });

  return (
    <span
      ref={triggerRef}
      onMouseDown={(e) => e.stopPropagation()}
      onClick={handleToggleOpen}
      style={{ position: "relative", display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
      {displayLabel ? (
        <span style={{
          height: 22, padding: "0 7px", borderRadius: 3,
          background: "var(--ink)", color: "var(--paper)",
          display: "flex", alignItems: "center",
          fontSize: 9, fontWeight: 700, fontFamily: "IBM Plex Mono, monospace",
          letterSpacing: "0.08em", textTransform: "uppercase",
        }}>{displayLabel}</span>
      ) : (
        <span style={{ display: "flex", alignItems: "center" }}>
          {values.length === 0
            ? <span style={{ width: 22, height: 22, borderRadius: "50%", border: "1.5px dashed var(--ink-4)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "var(--ink-4)" }}>+</span>
            : visible.map((id, i) => (
              <span key={id} style={{ marginLeft: i > 0 ? -7 : 0, zIndex: visible.length - i, position: "relative" }}>
                <Avatar owner={ctxOwners[id]} initials={id} />
              </span>
            ))
          }
          {extra > 0 && (
            <span style={{ marginLeft: -7, zIndex: 0, width: 22, height: 22, borderRadius: "50%", background: "var(--paper-3)", border: "1.5px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8.5, fontWeight: 700, color: "var(--ink-3)", fontFamily: "IBM Plex Mono, monospace" }}>
              +{extra}
            </span>
          )}
        </span>
      )}
      {open && (
        <React.Fragment>
          <div
            onMouseDown={(e) => { e.stopPropagation(); setOpen(false); }}
            onClick={(e) => { e.stopPropagation(); setOpen(false); }}
            style={{ position: "fixed", inset: 0, zIndex: 99 }} />
          <div
            onMouseDown={(e) => e.stopPropagation()}
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "fixed", ...dropPos,
              background: "var(--paper-2)", border: "1px solid var(--line)",
              borderRadius: 4, boxShadow: "0 12px 30px -8px rgba(0,0,0,0.25)",
              zIndex: 200, padding: 4, minWidth: 210, maxHeight: 320, overflowY: "auto",
            }}>

            {/* ALL row */}
            <button onClick={toggleAll} style={groupBtnStyle(allState)}
              onMouseEnter={(e) => { if (allState === "none") e.currentTarget.style.background = "var(--paper-3)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = allState !== "none" ? "rgba(138,58,31,0.10)" : "transparent"; }}>
              <span style={{ width: 22, height: 22, borderRadius: "50%", background: allState !== "none" ? "var(--accent)" : "var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 700, color: "var(--paper)", flexShrink: 0 }}>ALL</span>
              <span>전체</span>
              {allState === "all" && <span style={{ marginLeft: "auto" }}>✓</span>}
              {allState === "some" && <span style={{ marginLeft: "auto", opacity: 0.5 }}>—</span>}
            </button>

            <div style={{ height: 1, background: "var(--line)", margin: "4px 4px" }} />

            {ctxTeams.map((team) => {
              const ts = teamState(team);
              return (
                <React.Fragment key={team.id}>
                  <button onClick={() => toggleTeam(team)} style={groupBtnStyle(ts)}
                    onMouseEnter={(e) => { if (ts === "none") e.currentTarget.style.background = "var(--paper-3)"; }}
                    onMouseLeave={(e) => { e.currentTarget.style.background = ts !== "none" ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                    <span style={{ width: 22, height: 14, borderRadius: 2, background: ts !== "none" ? "var(--accent)" : "var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 700, color: "var(--paper)", flexShrink: 0 }}>{team.name}</span>
                    <span>{team.name}</span>
                    <span className="mono" style={{ marginLeft: "auto", fontSize: 9, opacity: 0.5 }}>{team.members.filter(m => ctxOwners[m]).length}</span>
                    {ts === "all" && <span>✓</span>}
                    {ts === "some" && <span style={{ opacity: 0.5 }}>—</span>}
                  </button>
                  {team.members.map((k) => {
                    const o2 = ctxOwners[k];
                    if (!o2) return null;
                    const active = values.includes(k);
                    return (
                      <button key={k}
                        onClick={() => toggle(k)}
                        style={{
                          display: "flex", alignItems: "center", gap: 8, width: "100%",
                          padding: "4px 8px 4px 22px", border: "none",
                          background: active ? "rgba(138,58,31,0.10)" : "transparent",
                          color: "var(--ink-2)", fontFamily: "inherit", fontSize: 12,
                          cursor: "pointer", borderRadius: 2, textAlign: "left",
                        }}
                        onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--paper-3)"; }}
                        onMouseLeave={(e) => { e.currentTarget.style.background = active ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                        <Avatar owner={o2} initials={k} />
                        <span>{o2.name}</span>
                        <span className="mono" style={{ marginLeft: "auto", color: "var(--ink-4)", fontSize: 10 }}>{o2.role}</span>
                        {active && <span style={{ color: "var(--accent)", fontSize: 11, lineHeight: 1 }}>✓</span>}
                      </button>
                    );
                  })}
                </React.Fragment>
              );
            })}
          </div>
        </React.Fragment>
      )}
    </span>
  );
}

    onSave(notes);

  };

  const rootColor = rootInfo(item.code || "").color;
  const dur = item.start && item.end ? dayDiff(item.start, item.end) : 0;
  const ownerList = (item.owners || []).map((id) => ({ id, o: ctxOwners[id] })).filter((x) => x.o);

  return (
    <div
      style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }}
      onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "var(--paper-2)", border: "1px solid var(--line)", borderRadius: 6,
          boxShadow: "0 24px 60px -16px rgba(0,0,0,0.3)", width: 420,
          display: "flex", flexDirection: "column", overflow: "hidden",
        }}>

        {/* Header */}
        <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "flex-start", gap: 10 }}>
          <span className="mono" style={{ fontSize: 11, color: rootColor, fontWeight: 700, letterSpacing: 0.3, paddingTop: 3, flexShrink: 0 }}>{item.code}</span>
          <span className="serif" style={{ fontSize: 18, flex: 1, letterSpacing: "-0.01em", color: "var(--ink)", lineHeight: 1.3 }}>{item.name}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", fontSize: 15, padding: 4, flexShrink: 0 }}>✕</button>
        </div>

        {/* Info grid */}
        <div style={{ padding: "14px 20px", display: "grid", gridTemplateColumns: "68px 1fr", rowGap: 10, columnGap: 12, fontSize: 12.5, alignItems: "start" }}>
          <span className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em", paddingTop: 2 }}>기간</span>
          <span style={{ color: "var(--ink-2)" }}>
            {item.start ? fmtDate(item.start) : "—"} → {item.end ? fmtDate(item.end) : "—"}
            {dur > 0 && <span className="mono" style={{ marginLeft: 8, color: "var(--ink-4)", fontSize: 11 }}>{dur}d</span>}
          </span>

          <span className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em", paddingTop: 2 }}>진행률</span>
          <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ flex: 1, maxWidth: 120, height: 5, background: "var(--line)", borderRadius: 3, overflow: "hidden" }}>
              <span style={{ display: "block", height: "100%", width: `${item.pct}%`, background: rootColor, borderRadius: 3 }} />
            </span>
            <span className="mono" style={{ fontSize: 11, color: "var(--ink-2)" }}>{item.pct}%</span>
          </span>

          {ownerList.length > 0 && (
            <React.Fragment>
              <span className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em", paddingTop: 4 }}>담당자</span>
              <span style={{ display: "flex", flexWrap: "wrap", gap: "6px 12px" }}>
                {ownerList.map(({ id, o }) => (
                  <span key={id} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <Avatar owner={o} initials={id} />
                    <span style={{ fontSize: 12, color: "var(--ink-2)" }}>{o.name}</span>
                    {o.role && <span className="mono" style={{ fontSize: 10, color: "var(--ink-4)" }}>{o.role}</span>}
                  </span>
                ))}
              </span>
            </React.Fragment>
          )}

          {item.segments && item.segments.length > 1 && (
            <React.Fragment>
              <span className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em", paddingTop: 2 }}>구간</span>
              <span style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {item.segments.map((seg, i) => (
                  <span key={i} className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>
                    {i + 1}. {seg.start ? fmtDate(seg.start) : "—"} → {seg.end ? fmtDate(seg.end) : "—"}
                  </span>
                ))}
              </span>
            </React.Fragment>
          )}
        </div>

        {/* Notes */}
        <div style={{ padding: "0 20px 20px", borderTop: "1px solid var(--line)" }}>
          <div className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em", margin: "12px 0 6px" }}>비고</div>
          <textarea
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            placeholder="메모를 입력하세요..."
            style={{
              width: "100%", minHeight: 90, resize: "vertical", boxSizing: "border-box",
              background: "var(--paper)", border: "1px solid var(--line-2)", borderRadius: 3,
              padding: "8px 10px", fontFamily: "IBM Plex Sans, sans-serif",
              fontSize: 12.5, color: "var(--ink)", outline: "none", lineHeight: 1.5,
            }}
            onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
            onBlur={(e) => e.target.style.borderColor = "var(--line-2)"}
          />
        </div>

        {/* Footer */}
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 8, padding: "12px 20px", borderTop: "1px solid var(--line)" }}>
          {saved && <span className="mono" style={{ fontSize: 10.5, color: "var(--accent)", marginRight: "auto" }}>저장됨 ✓</span>}
          <button onClick={onClose} style={{ border: "1px solid var(--line-2)", padding: "6px 14px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>닫기</button>
          <button onClick={handleSave} style={{ border: "1px solid var(--ink)", padding: "6px 14px", borderRadius: 3, background: "var(--ink)", color: "var(--paper)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>저장</button>
        </div>
      </div>
    </div>
  );
}

// ── 팀원 편집 모달 ────────────────────────────────────────────────────────
const TINT_PALETTE = [
  "var(--accent)", "var(--rose)", "var(--olive)", "var(--plum)", "var(--slate)", "var(--clay)",
  "#5b8c5a", "#6b4e71", "#3d7a8a", "#8a6a3d",
];

function TeamModal({ owners, teams, onSave, onClose }) {
  const [eo, setEo] = useState(() => JSON.parse(JSON.stringify(owners)));
  const [et, setEt] = useState(() => teams.map((t) => ({ ...t, members: [...t.members] })));
  const [renames, setRenames] = useState({});

  const updOwner = (id, patch) => setEo((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));

  const renameOwner = (oldId, newId) => {
    newId = newId.trim();
    if (!newId || newId === oldId) return;
    if (eo[newId]) return;
    setRenames((prev) => {
      const n = { ...prev };
      const origKey = Object.keys(n).find((k) => n[k] === oldId) ?? oldId;
      if (origKey === newId) delete n[origKey];
      else n[origKey] = newId;
      return n;
    });
    setEo((prev) => { const n = { ...prev, [newId]: { ...prev[oldId] } }; delete n[oldId]; return n; });
    setEt((prev) => prev.map((t) => ({ ...t, members: t.members.map((m) => m === oldId ? newId : m) })));
  };

  const delOwner = (id) => {
    setEo((prev) => { const n = { ...prev }; delete n[id]; return n; });
    setEt((prev) => prev.map((t) => ({ ...t, members: t.members.filter((m) => m !== id) })));
  };

  const addOwner = (teamId) => {
    const used = new Set(Object.values(eo).map((o) => o.tint));
    const tint = TINT_PALETTE.find((c) => !used.has(c)) || TINT_PALETTE[0];
    const id = "M" + Date.now().toString(36).slice(-4).toUpperCase();
    setEo((prev) => ({ ...prev, [id]: { name: "", team: teamId, role: "", tint } }));
    setEt((prev) => prev.map((t) => t.id === teamId ? { ...t, members: [...t.members, id] } : t));
  };

  const updTeam = (teamId, patch) => setEt((prev) => prev.map((t) => t.id === teamId ? { ...t, ...patch } : t));

  const addTeam = () => {
    const id = "T" + Date.now().toString(36).slice(-4).toUpperCase();
    setEt((prev) => [...prev, { id, name: "새 팀", members: [] }]);
  };

  const delTeam = (teamId) => {
    const members = et.find((t) => t.id === teamId)?.members || [];
    setEo((prev) => { const n = { ...prev }; members.forEach((m) => delete n[m]); return n; });
    setEt((prev) => prev.filter((t) => t.id !== teamId));
  };

  const handleSave = () => {
    const cleaned = Object.fromEntries(Object.entries(eo).filter(([, o]) => o.name.trim()));
    const cleanedTeams = et
      .filter((t) => t.name.trim())
      .map((t) => ({ ...t, members: t.members.filter((m) => cleaned[m]) }));
    onSave(cleaned, cleanedTeams, renames);
    onClose();
  };

  const inputStyle = {
    border: "none", borderBottom: "1px solid var(--line-2)",
    background: "transparent", outline: "none",
    fontFamily: "IBM Plex Sans, sans-serif", color: "var(--ink)", padding: "2px 0",
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "var(--paper-2)", border: "1px solid var(--line)", borderRadius: 6,
        boxShadow: "0 24px 60px -16px rgba(0,0,0,0.3)", width: 460,
        maxHeight: "80vh", display: "flex", flexDirection: "column", overflow: "hidden",
      }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: "1px solid var(--line)" }}>
          <span className="serif" style={{ fontSize: 20, flex: 1, letterSpacing: "-0.01em", color: "var(--ink)" }}>팀원 관리</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", fontSize: 15, padding: 4 }}>✕</button>
        </div>

        {/* Body */}
        <div style={{ overflowY: "auto", flex: 1, padding: "8px 20px 20px" }}>
          {et.map((team) => (
            <div key={team.id} style={{ marginTop: 18 }}>
              <div className="mono small-caps" style={{ fontSize: 10.5, color: "var(--ink-3)", marginBottom: 8, display: "flex", alignItems: "center", gap: 8, letterSpacing: "0.1em" }}>
                <input
                  value={team.name}
                  onChange={(e) => updTeam(team.id, { name: e.target.value })}
                  style={{
                    background: "transparent", border: "none", borderBottom: "1px solid var(--line-2)",
                    outline: "none", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5,
                    color: "var(--ink-3)", letterSpacing: "0.1em", textTransform: "uppercase",
                    padding: "0 0 1px", minWidth: 0, width: `${Math.max((team.name || "").length, 4)}ch`,
                  }}
                />
                <span style={{ flex: 1, height: 1, background: "var(--line-2)" }} />
                <span>{team.members.filter((m) => eo[m]).length}</span>
                <span onClick={() => delTeam(team.id)}
                  style={{ cursor: "pointer", color: "var(--ink-4)", fontSize: 10, lineHeight: 1 }}
                  onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"}
                  onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</span>
              </div>
              {/* Column headers */}
              <div style={{ display: "grid", gridTemplateColumns: "26px 42px 1fr 90px 24px", gap: 8, padding: "0 0 5px", borderBottom: "1px solid var(--line-2)" }}>
                {["", "ID", "이름", "직무", ""].map((h, i) => (
                  <span key={i} className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em" }}>{h}</span>
                ))}
              </div>
              {/* Member rows */}
              {team.members.filter((m) => eo[m]).map((id) => {
                const o = eo[id];
                return (
                  <div key={id} style={{ display: "grid", gridTemplateColumns: "26px 42px 1fr 90px 24px", gap: 8, alignItems: "center", padding: "5px 0" }}>
                    <span style={{ width: 22, height: 22, borderRadius: "50%", background: o.tint, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: "var(--paper)", flexShrink: 0, fontFamily: "IBM Plex Mono, monospace" }}>{id.slice(0, 2)}</span>
                    <input
                      defaultValue={id}
                      onFocus={(e) => e.target.select()}
                      onBlur={(e) => renameOwner(id, e.target.value)}
                      style={{ fontSize: 10, fontFamily: "IBM Plex Mono, monospace", color: "var(--ink-3)", background: "transparent", border: "none", borderBottom: "1px solid transparent", outline: "none", width: "100%", padding: "1px 0" }}
                      onMouseEnter={(e) => e.target.style.borderBottomColor = "var(--line-2)"}
                      onMouseLeave={(e) => { if (document.activeElement !== e.target) e.target.style.borderBottomColor = "transparent"; }}
                      onFocusCapture={(e) => e.target.style.borderBottomColor = "var(--accent)"}
                      onBlurCapture={(e) => e.target.style.borderBottomColor = "transparent"}
                    />
                    <input value={o.name} onChange={(e) => updOwner(id, { name: e.target.value })} placeholder="이름" style={{ ...inputStyle, fontSize: 13 }} />
                    <input value={o.role} onChange={(e) => updOwner(id, { role: e.target.value })} placeholder="직무" style={{ ...inputStyle, fontSize: 11, fontFamily: "IBM Plex Mono, monospace", color: "var(--ink-3)" }} />
                    <span onClick={() => delOwner(id)} style={{ cursor: "pointer", color: "var(--ink-4)", fontSize: 11, textAlign: "center", borderRadius: 2, lineHeight: "22px" }}
                      onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"}
                      onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</span>
                  </div>
                );
              })}
              {/* Add member button */}
              <button onClick={() => addOwner(team.id)} style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", cursor: "pointer", color: "var(--ink-4)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, padding: "4px 0", letterSpacing: "0.05em" }}
                onMouseEnter={(e) => e.currentTarget.style.color = "var(--accent)"}
                onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>
                <span style={{ fontSize: 14, lineHeight: 1 }}>+</span> {team.name}에 팀원 추가
              </button>
            </div>
          ))}

          {/* Add team button */}
          <button onClick={addTeam} style={{
            marginTop: 20, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            width: "100%", padding: "7px 0", background: "none",
            border: "1px dashed var(--line-2)", borderRadius: 3, cursor: "pointer",
            color: "var(--ink-4)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, letterSpacing: "0.05em",
          }}
            onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--accent)"; e.currentTarget.style.color = "var(--accent)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--line-2)"; e.currentTarget.style.color = "var(--ink-4)"; }}>
            <span style={{ fontSize: 14, lineHeight: 1 }}>+</span> 새 팀 추가
          </button>
        </div>

        {/* Footer */}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "12px 20px", borderTop: "1px solid var(--line)" }}>
          <button onClick={onClose} style={{ border: "1px solid var(--line-2)", padding: "6px 14px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>취소</button>
          <button onClick={handleSave} style={{ border: "1px solid var(--ink)", padding: "6px 14px", borderRadius: 3, background: "var(--ink)", color: "var(--paper)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>저장</button>
        </div>
      </div>
    </div>
  );
}

function Footer() {
  const { owners: ctxOwners, teams: ctxTeams } = React.useContext(OwnersCtx);
  return (
    <footer style={{ marginTop: 32, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 28, paddingTop: 18, borderTop: "1px solid var(--line)" }}>
      <div>
        <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 8 }}>Modules</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: "var(--ink-2)" }}>
          {Object.entries(ROOTS).map(([k, r]) =>
          <div key={k} style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 16, height: 8, background: r.color, borderRadius: 1 }} />
              <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{k}</span>
              <span>{r.name}</span>
            </div>
          )}
        </div>
        <div style={{ marginTop: 14 }}>
          <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 6 }}>Interaction map</div>
          <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "4px 12px", fontSize: 11.5, color: "var(--ink-2)" }} className="mono">
            <span style={{ color: "var(--ink-4)" }}>name</span><span>click summary → collapse, double-click → edit</span>
            <span style={{ color: "var(--ink-4)" }}>avatar</span><span>click owner avatar → pick new owner</span>
            <span style={{ color: "var(--ink-4)" }}>%</span><span>click progress → type 0–100</span>
            <span style={{ color: "var(--ink-4)" }}>⋮⋮</span><span>drag row → reorder + indent to change level</span>
            <span style={{ color: "var(--ink-4)" }}>+</span><span>new task button at the bottom of list</span>
            <span style={{ color: "var(--ink-4)" }}>bar</span><span>drag middle / edges → reschedule</span>
            <span style={{ color: "var(--ink-4)" }}>○</span><span>pull from bar tail → draw dep arrow</span>
            <span style={{ color: "var(--ink-4)" }}>arrow</span><span>click + Delete (or right-click) → remove</span>
            <span style={{ color: "var(--ink-4)" }}>empty</span><span>drag background → pan timeline</span>
          </div>
        </div>
      </div>

      <div>
        <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 8 }}>Team</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {ctxTeams.map((team) =>
          <div key={team.id}>
              <div className="mono small-caps" style={{ color: "var(--ink-2)", marginBottom: 6, display: "flex", alignItems: "baseline", gap: 6 }}>
                <span>{team.name}</span>
                <span style={{ flex: 1, height: 1, background: "var(--line-2)" }} />
                <span style={{ color: "var(--ink-4)" }}>{team.members.length}</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {team.members.map((k) => {
                const o = ctxOwners[k];
                if (!o) return null;
                return (
                  <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--ink-2)" }}>
                      <Avatar owner={o} initials={k} />
                      <span>{o.name}</span>
                      <span className="mono" style={{ color: "var(--ink-4)", fontSize: 10.5, marginLeft: "auto" }}>{o.role}</span>
                    </div>);

              })}
              </div>
            </div>
          )}
        </div>
      </div>

      <div>
        <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 8 }}>Critical dates</div>
        <ul style={{ margin: 0, padding: 0, listStyle: "none", fontSize: 12.5, color: "var(--ink-2)" }}>
          {PROJECT_CONFIG.criticalDates.map((cd, i) => (
            <li key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: i < PROJECT_CONFIG.criticalDates.length - 1 ? "1px dashed var(--line-2)" : "none" }}>
              <span>{cd.label}</span>
              <span className="mono" style={{ color: cd.accent ? "var(--accent)" : "inherit" }}>{cd.date}</span>
            </li>
          ))}
        </ul>
      </div>
    </footer>);

}

// ---------- mount ----------
ReactDOM.createRoot(document.getElementById("root")).render(<App />);  </script></body></html>
