    // tweaks-panel.jsx
    // Reusable Tweaks shell + form-control helpers.
    //

    // posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
    // individual prototypes don't re-roll it. Ships a consistent set of controls so you
    // don't hand-draw <input type="range">, segmented radios, steppers, etc.
    //
    // Usage (in an HTML file that loads React + Babel):

    //                        options={['#D97757', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
    //                        onChange={(v) => setTweak('primaryColor', v)} />
    //           <TweakColor  label="Palette" value={t.palette}
    //                        options={[['#D97757', '#29261b', '#f6f4ef'],
    //                                  ['#475569', '#0f172a', '#f1f5f9']]}
    //                        onChange={(v) => setTweak('palette', v)} />
    //           <TweakToggle label="Dark mode" value={t.dark}

    //
    // ─────────────────────────────────────────────────────────────────────────────

    const __TWEAKS_STYLE = `

  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}

  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}

  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}

  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}

  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}

    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}

    overflow-wrap:anywhere}

  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}

    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}

  .twk-num{display:flex;align-items:center;box-sizing:border-box;min-width:0;height:26px;padding:0 0 0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6)}
  .twk-num-lbl{font-weight:500;color:rgba(41,38,27,.6);cursor:ew-resize;
    user-select:none;padding-right:8px}
  .twk-num input{flex:1;min-width:0;height:100%;border:0;background:transparent;
    font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;
    outline:none;color:inherit;-moz-appearance:textfield}
  .twk-num input::-webkit-inner-spin-button,.twk-num input::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0}
  .twk-num-unit{padding-right:8px;color:rgba(41,38,27,.45)}

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}

  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);
    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),
    0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

    // ── useTweaks ───────────────────────────────────────────────────────────────
    // Single source of truth for tweak values. setTweak persists via the host
    // (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
    function useTweaks(defaults) {
      const [values, setValues] = React.useState(defaults);
      // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
      // useState-style call doesn't write a "[object Object]" key into the persisted
      // JSON block.
      const setTweak = React.useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
          ? keyOrEdits : { [keyOrEdits]: val };
        setValues((prev) => ({ ...prev, ...edits }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
        // Same-window signal so in-page listeners (deck-stage rail thumbnails)
        // can react — the parent message only reaches the host, not peers.
        window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
      }, []);
      return [values, setTweak];
    }

    // ── TweaksPanel ─────────────────────────────────────────────────────────────
    // Floating shell. Registers the protocol listener BEFORE announcing
    // availability — if the announce ran first, the host's activate could land
    // before our handler exists and the toolbar toggle would silently no-op.
    // The close button posts __edit_mode_dismissed so the host's toolbar toggle
    // flips off in lockstep; the host echoes __deactivate_edit_mode back which
    // is what actually hides the panel.
    function TweaksPanel({ title = 'Tweaks', children }) {
      const [open, setOpen] = React.useState(false);
      const dragRef = React.useRef(null);
      const offsetRef = React.useRef({ x: 16, y: 16 });
      const PAD = 16;

      const clampToViewport = React.useCallback(() => {
        const panel = dragRef.current;
        if (!panel) return;
        const w = panel.offsetWidth, h = panel.offsetHeight;
        const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
        const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
        offsetRef.current = {
          x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
          y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
        };
        panel.style.right = offsetRef.current.x + 'px';
        panel.style.bottom = offsetRef.current.y + 'px';
      }, []);

      React.useEffect(() => {
        if (!open) return;
        clampToViewport();
        if (typeof ResizeObserver === 'undefined') {
          window.addEventListener('resize', clampToViewport);
          return () => window.removeEventListener('resize', clampToViewport);
        }
        const ro = new ResizeObserver(clampToViewport);
        ro.observe(document.documentElement);
        return () => ro.disconnect();
      }, [open, clampToViewport]);

      React.useEffect(() => {
        const onMsg = (e) => {
          const t = e?.data?.type;
          if (t === '__activate_edit_mode') setOpen(true);
          else if (t === '__deactivate_edit_mode') setOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const dismiss = () => {
        setOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const onDragStart = (e) => {
        const panel = dragRef.current;
        if (!panel) return;
        const r = panel.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const startRight = window.innerWidth - r.right;
        const startBottom = window.innerHeight - r.bottom;
        const move = (ev) => {
          offsetRef.current = {
            x: startRight - (ev.clientX - sx),
            y: startBottom - (ev.clientY - sy),
          };
          clampToViewport();
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      };

      if (!open) return null;
      return (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
            style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" aria-label="Close tweaks"
                onMouseDown={(e) => e.stopPropagation()}
                onClick={dismiss}>✕</button>
            </div>
            <div className="twk-body">
              {children}
            </div>
          </div>
        </>
      );
    }

    // ── Layout helpers ──────────────────────────────────────────────────────────

    function TweakSection({ label, children }) {
      return (
        <>
          <div className="twk-sect">{label}</div>
          {children}
        </>
      );
    }

    function TweakRow({ label, value, children, inline = false }) {
      return (
        <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
          <div className="twk-lbl">
            <span>{label}</span>
            {value != null && <span className="twk-val">{value}</span>}
          </div>
          {children}
        </div>
      );
    }

    // ── Controls ────────────────────────────────────────────────────────────────

    function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
      return (
        <TweakRow label={label} value={`${value}${unit}`}>
          <input type="range" className="twk-slider" min={min} max={max} step={step}
            value={value} onChange={(e) => onChange(Number(e.target.value))} />
        </TweakRow>
      );
    }

    function TweakToggle({ label, value, onChange }) {
      return (
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>{label}</span></div>
          <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
            role="switch" aria-checked={!!value}
            onClick={() => onChange(!value)}><i /></button>
        </div>
      );
    }

    function TweakRadio({ label, value, options, onChange }) {
      const trackRef = React.useRef(null);
      const [dragging, setDragging] = React.useState(false);
      // The active value is read by pointer-move handlers attached for the lifetime
      // of a drag — ref it so a stale closure doesn't fire onChange for every move.
      const valueRef = React.useRef(value);
      valueRef.current = value;

      // Segments wrap mid-word once per-segment width runs out. The track is
      // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
      // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
      // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
      // back to a dropdown rather than wrap.
      const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
      const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
      const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
      if (!fitsAsSegments) {
        // <select> emits strings — map back to the original option value so the
        // fallback stays type-preserving (numbers, booleans) like the segment path.
        const resolve = (s) => {
          const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
          return m === undefined ? s : typeof m === 'object' ? m.value : m;
        };
        return <TweakSelect label={label} value={value} options={options}
          onChange={(s) => onChange(resolve(s))} />;
      }
      const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
      const idx = Math.max(0, opts.findIndex((o) => o.value === value));
      const n = opts.length;

      const segAt = (clientX) => {
        const r = trackRef.current.getBoundingClientRect();
        const inner = r.width - 4;
        const i = Math.floor(((clientX - r.left - 2) / inner) * n);
        return opts[Math.max(0, Math.min(n - 1, i))].value;
      };

      const onPointerDown = (e) => {
        setDragging(true);
        const v0 = segAt(e.clientX);
        if (v0 !== valueRef.current) onChange(v0);
        const move = (ev) => {
          if (!trackRef.current) return;
          const v = segAt(ev.clientX);
          if (v !== valueRef.current) onChange(v);
        };
        const up = () => {
          setDragging(false);
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      return (
        <TweakRow label={label}>
          <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
            className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
            <div className="twk-seg-thumb"
              style={{
                left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                width: `calc((100% - 4px) / ${n})`
              }} />
            {opts.map((o) => (
              <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
                {o.label}
              </button>
            ))}
          </div>
        </TweakRow>
      );
    }

    function TweakSelect({ label, value, options, onChange }) {
      return (
        <TweakRow label={label}>
          <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
            {options.map((o) => {
              const v = typeof o === 'object' ? o.value : o;
              const l = typeof o === 'object' ? o.label : o;
              return <option key={v} value={v}>{l}</option>;
            })}
          </select>
        </TweakRow>
      );
    }

    function TweakText({ label, value, placeholder, onChange }) {
      return (
        <TweakRow label={label}>
          <input className="twk-field" type="text" value={value} placeholder={placeholder}
            onChange={(e) => onChange(e.target.value)} />
        </TweakRow>
      );
    }

    function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
      const clamp = (n) => {
        if (min != null && n < min) return min;
        if (max != null && n > max) return max;
        return n;
      };
      const startRef = React.useRef({ x: 0, val: 0 });
      const onScrubStart = (e) => {
        e.preventDefault();
        startRef.current = { x: e.clientX, val: value };
        const decimals = (String(step).split('.')[1] || '').length;
        const move = (ev) => {
          const dx = ev.clientX - startRef.current.x;
          const raw = startRef.current.val + dx * step;
          const snapped = Math.round(raw / step) * step;
          onChange(clamp(Number(snapped.toFixed(decimals))));
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

    function __twkIsLight(hex) {
      const h = String(hex).replace('#', '');
      const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');

    // renders solid, a palette renders colors[0] as the hero (left ~2/3) with the

        const lvl = it.level;

        const parts = [];
        for (let k = 1; k <= lvl; k++) parts.push(c[k] || 0);

    // Aggregate min/max/avg pct for a summary's leaves.
    function aggregateSummary(items, idx) {
      const [start, end] = subtreeRange(items, idx);
      const leaves = [];
      for (let i = start + 1; i <= end; i++) {
        if (!hasChildrenAfter(items, i)) leaves.push(items[i]);
      }
      if (!leaves.length) return null;
      const dated = leaves.filter(l => l.start && l.end);
      if (!dated.length) return null;
      const minStart = dated.reduce((m, l) => l.start < m ? l.start : m, dated[0].start);
      const maxEnd = dated.reduce((m, l) => l.end > m ? l.end : m, dated[0].end);
      const totalD = dated.reduce((s, l) => s + Math.max(1, dayDiff(l.start, l.end)), 0);
      const weighted = dated.reduce((s, l) => s + Math.max(1, dayDiff(l.start, l.end)) * l.pct, 0);

      const prevItemsIdx = items.findIndex((it) => it.id === prev.id);

    // ====================================================================

      useEffect(() => {

        TEAMS.splice(0, TEAMS.length, ...teams, vendorTeam);
      }, [owners, teams, vendors]);

      const updateTeamData = useCallback((newOwners, newTeams, renames = {}) => {
        setOwners(newOwners);
        setTeams(newTeams);
        if (Object.keys(renames).length > 0) {
          setItems((prev) => prev.map((it) => ({
            ...it,
            owner: renames[it.owner] ?? it.owner,
            collaborators: (it.collaborators || []).map((id) => renames[id] ?? id),
          })));
        }
      }, []);

      useEffect(() => {
        document.title = `${meta.wbsPrefix} — ${meta.wbsSuffix}`;
      }, [meta.wbsPrefix, meta.wbsSuffix]);

      // Map legacy keys (density/scale) so users who saved old settings still work.
      const zoom = (v.zoom === "month4" || !v.zoom) ? "month1" : v.zoom; // month4 제거 → month1 fallback
      // Day width by zoom level. month1 = daily cells; month12 = monthly cells.
      const dayW = zoom === "month1" ? 24 : 5;
      const rowH = 30;

      const parseLocalDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

      // 편집 가능한 프로젝트 기간 (meta에서 읽기, 없으면 CONFIG 기본값)
      const projStart = meta.projectStart ? parseLocalDate(meta.projectStart) : PROJECT_START;
      const projEnd = meta.projectEnd ? parseLocalDate(meta.projectEnd) : PROJECT_END;

      // Visible timeline range: 전체 프로젝트 기간을 항상 표시.
      const viewStart = zoom === "month12" ? new Date(projStart.getFullYear(), 0, 1) : projStart;
      const viewEnd = zoom === "month12" ? new Date(projEnd.getFullYear(), 11, 31) : projEnd;
      const viewTotalDays = dayDiff(viewStart, viewEnd);
      const leftW = 380;

      // ------- editable state (auto-persisted to localStorage) -------
      const [items, setItems] = useState(() => {
        const saved = loadFromStorage();
        const rawItems = (saved && saved.items && saved.items.length) ? saved.items : INITIAL_WBS.map(it => ({ ...it }));
        return rawItems.map(it => {
          const base = (it.segments && it.segments.length > 0) ? it : { ...it, segments: [{ start: it.start, end: it.end }] };
          return {
            ...base,
            owner: base.owner || (Array.isArray(base.owners) ? (base.owners[0] || null) : null),
            collaborators: base.collaborators || (Array.isArray(base.owners) ? base.owners.slice(1) : []),
            notes: base.notes || "",
          };
        });
      });
      const [collapsed, setCollapsed] = useState(() => {
        const saved = loadFromStorage();
        return (saved && saved.collapsed) || {};
      });


      // Persist on every change (localStorage).
      useEffect(() => { saveToStorage(items, collapsed, meta, owners, teams, vendors); }, [items, collapsed, meta, owners, teams, vendors]);

      // ── Auto-save to local save server ───────────────────────────────────
      const SAVE_FILENAME = STORAGE_KEY + '.json';
      const [saveStatus, setSaveStatus] = useState('idle'); // 'idle'|'dirty'|'saving'|'saved'|'error'
      const [lastSavedAt, setLastSavedAt] = useState(null);
      const [isDirty, setIsDirty] = useState(false);
      const [serverOnline, setServerOnline] = useState(false);
      const loadedSavedAt = useRef(null); // 페이지 로드 시 서버 JSON의 savedAt 기록 (충돌 감지용)
      const isHTTP = window.location.protocol === 'http:' || window.location.protocol === 'https:';
      const isLocal = isHTTP && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
      const isGitHubPages = isHTTP && !isLocal && window.location.hostname.endsWith('.github.io');
      // owner/repo auto-derived from GitHub Pages URL: https://{owner}.github.io/{repo}/...
      const ghOwner = isGitHubPages ? window.location.hostname.replace('.github.io', '') : null;
      const ghRepo  = isGitHubPages ? window.location.pathname.split('/').filter(Boolean)[0] : null;

      // 서버 생존 확인 (5초마다)
      useEffect(() => {
        if (!isLocal) return;
        const check = () =>
          fetch('/ping').then((r) => setServerOnline(r.ok)).catch(() => setServerOnline(false));
        check();
        const id = setInterval(check, 5000);
        return () => clearInterval(id);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // On mount: try to load server save file (may be newer than localStorage, e.g. different browser)
      useEffect(() => {
        if (!isHTTP) return; // file:// 프로토콜에서는 skip
        // Check if a real save server exists (Claude Code web env).
        // Local python http.server has no /ping, so hasServer=false.
        // When no save server, always prefer JSON (git pull is the source of truth).
        const hasSaveServer = isLocal ? fetch('/ping').then((r) => r.ok).catch(() => false) : Promise.resolve(false);
        hasSaveServer.then((hasServer) => {
          fetch('./' + SAVE_FILENAME + '?t=' + Date.now())
            .then((r) => r.ok ? r.json() : null)
            .then((data) => {
              if (!data || !data.items) return;
              const serverTime = data.savedAt ? new Date(data.savedAt).getTime() : 0;
              const localRaw = localStorage.getItem(STORAGE_KEY);
              const localTime = localRaw ? (() => { try { return new Date(JSON.parse(localRaw)._savedAt || 0).getTime(); } catch { return 0; } })() : 0;
              // No save server = local mode: JSON from git is ground truth, ignore localStorage timestamp
              if (!hasServer || serverTime >= localTime) {
                const restored = deserializeItems(data.items);
                if (restored) {
                  setItems(restored);
                  dirtyIdsRef.current = new Set();
                  deletedIdsRef.current = new Set();
                  if (data.collapsed) setCollapsed(data.collapsed);
                  if (data.meta) setMetaState((m) => ({ ...m, ...data.meta }));
                  if (data.owners) setOwners(data.owners);
                  if (data.teams) setTeams(data.teams);
                  if (data.vendors) setVendors(data.vendors);
                  setSaveStatus('saved');
                  if (data.savedAt) { setLastSavedAt(new Date(data.savedAt)); loadedSavedAt.current = data.savedAt; }
                }
              }
            })
            .catch(() => { /* JSON 파일 없음 — localStorage 사용 */ });
        });
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // 변경 감지 → dirty 표시
      const isFirstRender = useRef(true);
      useEffect(() => {
        if (isFirstRender.current) { isFirstRender.current = false; return; }
        setIsDirty(true);
        setSaveStatus('dirty');
      }, [items, collapsed, meta, owners, teams, vendors]); // eslint-disable-line react-hooks/exhaustive-deps

      // GitHub API로 직접 커밋 — task-level merge (GitHub Pages 환경용)
      const saveToGitHub = useCallback(async () => {
        const PAT_KEY = '__gh_pat__' + (currentUser || '');
        let token = localStorage.getItem(PAT_KEY);
        if (!token) {
          token = window.prompt(
            'GitHub Personal Access Token을 입력하세요.\n' +
            '(repo write 권한 필요 — 한 번만 입력하면 저장됩니다)'
          );
          if (!token) { setSaveStatus('error'); return; }
          localStorage.setItem(PAT_KEY, token.trim());
          token = token.trim();
        }
        const apiPath = `https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/output/${SAVE_FILENAME}`;
        const headers = { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
        setSaveStatus('saving');
        try {
          const getRes = await fetch(apiPath, { headers });
          if (getRes.status === 401) {
            localStorage.removeItem(PAT_KEY);
            setSaveStatus('error');
            alert('토큰이 유효하지 않습니다. 다시 시도해주세요.');
            return;
          }
          const fileInfo = getRes.ok ? await getRes.json() : null;

          // Task-level merge: 서버 최신 상태 기준으로 내가 수정한 태스크만 덮어씀
          let mergedItems = items;
          let mergedMeta = meta, mergedOwners = owners, mergedTeams = teams, mergedVendors = vendors;
          if (fileInfo && fileInfo.content) {
            try {
              const serverRaw = JSON.parse(decodeURIComponent(escape(atob(fileInfo.content.replace(/\n/g, '')))));
              const serverItems = deserializeItems(serverRaw.items) || [];
              const serverMap = new Map(serverItems.map(it => [it.id, it]));
              const localIds = new Set(items.map(it => it.id));
              // 로컬 순서 유지, dirty 아닌 항목은 서버 버전으로 교체
              mergedItems = items
                .filter(li => !deletedIdsRef.current.has(li.id))
                .map(li => dirtyIdsRef.current.has(li.id) ? li : (serverMap.get(li.id) || li));
              // 다른 사람이 추가한 항목 뒤에 붙임
              serverItems.forEach(si => {
                if (!localIds.has(si.id) && !deletedIdsRef.current.has(si.id)) mergedItems.push(si);
              });
              // 어드민이 아닌 경우 메타/팀 정보는 서버 버전 사용
              if (!isAdmin) {
                mergedMeta = serverRaw.meta || meta;
                mergedOwners = serverRaw.owners || owners;
                mergedTeams = serverRaw.teams || teams;
                mergedVendors = serverRaw.vendors || vendors;
              }
            } catch { /* 파싱 실패 시 로컬 상태로 전체 저장 */ }
          }

          const payload = JSON.stringify({
            version: 1, savedAt: new Date().toISOString(),
            items: serializeItems(mergedItems), collapsed,
            meta: mergedMeta, owners: mergedOwners, teams: mergedTeams, vendors: mergedVendors,
          });
          const content = btoa(unescape(encodeURIComponent(payload)));
          const ts = new Date().toISOString().slice(0, 16).replace('T', ' ');
          const body = { message: `Save ${ts}`, content };
          if (fileInfo && fileInfo.sha) body.sha = fileInfo.sha;
          let putRes = await fetch(apiPath, { method: 'PUT', headers, body: JSON.stringify(body) });
          if (putRes.status === 422 || putRes.status === 409) {
            const retryGet = await fetch(apiPath, { headers });
            const retryInfo = retryGet.ok ? await retryGet.json() : null;
            if (retryInfo?.sha) {
              body.sha = retryInfo.sha;
              putRes = await fetch(apiPath, { method: 'PUT', headers, body: JSON.stringify(body) });
            }
          }
          if (putRes.ok) {
            const now = new Date();
            setSaveStatus('saved'); setIsDirty(false); setLastSavedAt(now); loadedSavedAt.current = now.toISOString();
            dirtyIdsRef.current = new Set();
            deletedIdsRef.current = new Set();
          }
          else { setSaveStatus('error'); alert('저장 실패. 잠시 후 다시 시도해주세요.\n(오류: ' + putRes.status + ')'); console.error('[GH Save]', await putRes.text()); }
        } catch (err) { setSaveStatus('error'); console.error('[GH Save]', err); }
      }, [items, collapsed, meta, owners, teams, vendors]); // eslint-disable-line react-hooks/exhaustive-deps

      // 수동 저장
      const saveToServer = useCallback(() => {
        if (!isLocal && !isGitHubPages) return;
        let payload;
        try {
          payload = JSON.stringify({
            version: 1,
            savedAt: new Date().toISOString(),
            items: serializeItems(items),
            collapsed,
            meta,
            owners,
            teams,
            vendors, // 외주사 정보도 함께 저장
          });
        } catch (e) {
          console.error('[Save] JSON.stringify failed:', e);
          setSaveStatus('error');
          return;
        }
        if (isGitHubPages) { saveToGitHub(); return; }
        setSaveStatus('saving');
        fetch('/ping')
          .then((r) => {
            if (!r.ok) throw new Error('ping-fail');
            return fetch('/save?file=' + SAVE_FILENAME, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload,
            });
          })
          .then((r) => {
            if (r.ok) { setSaveStatus('saved'); setIsDirty(false); setLastSavedAt(new Date()); }
            else { console.error('[Save] server returned', r.status); setSaveStatus('error'); }
          })
          .catch((err) => {
            console.error('[Save] network error:', err.message,
              '— 서버 창(Gantt Server)에서 에러 로그를 확인하세요.');
            setSaveStatus('error');
          });
      }, [items, collapsed, meta, owners, teams, vendors, saveToGitHub]); // eslint-disable-line react-hooks/exhaustive-deps

      // Export current state as a JSON file the user can keep. owners, teams, vendors 정보도 함께 저장하도록 수정. (기존 export 기능은 유지)
      const exportJSON = useCallback(() => downloadJSON(items, collapsed, meta, owners, teams, vendors), [items, collapsed, meta, owners, teams, vendors]);

      // Import a JSON file the user picks; merge { items, collapsed }.
      const importJSON = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            const nextItems = deserializeItems(parsed.items);
            if (!nextItems) throw new Error("invalid items");
            setItems(nextItems);
            setCollapsed(parsed.collapsed || {});
            if (parsed.meta) setMetaState(parsed.meta);

            if (parsed.owners) setOwners(parsed.owners);
            if (parsed.teams) setTeams(parsed.teams);
            if (parsed.vendors) setVendors(parsed.vendors);
          } catch (err) {
            alert("Could not parse JSON file: " + err.message);
          }
        };
        reader.readAsText(file);
      }, []);

      // Reset to initial data; also clears localStorage.
      const resetData = useCallback(() => {
        if (!confirm("Reset all tasks back to the initial WBS? This will discard your changes.")) return;
        clearStorage();
        setItems(INITIAL_WBS);
        setCollapsed({});
        setMetaState({
          subtitle: PROJECT_CONFIG.subtitle,
          wbsPrefix: PROJECT_CONFIG.wbsPrefix,
          wbsSuffix: PROJECT_CONFIG.wbsSuffix,
          headerRight: PROJECT_CONFIG.headerRight,
          projectStart: PROJECT_CONFIG.projectStart.toISOString().slice(0, 10),
          projectEnd: PROJECT_CONFIG.projectEnd.toISOString().slice(0, 10),
        });
      }, []);

      // Derive codes from current items
      const itemsWithCodes = useMemo(() => deriveCodes(items), [items]);

      // Compute per-item summary aggregate
      const enriched = useMemo(() => {
        return itemsWithCodes.map((it, i) => {
          const isSummary = hasChildrenAfter(items, i);
          if (!isSummary) return { ...it, isSummary: false };
          const agg = aggregateSummary(items, i);
          // fallback: use item's own dates if children have none (prevents bar jumping to PROJECT_START)
          const fallbackStart = it.start || (it.segments && it.segments[0]?.start) || null;
          const fallbackEnd   = it.end   || (it.segments && it.segments[0]?.end)   || null;
          return { ...it, isSummary: true, start: agg ? agg.start : fallbackStart, end: agg ? agg.end : fallbackEnd, pct: agg ? agg.pct : 0, leafCount: agg ? agg.leafCount : 0 };
        });
      }, [items, itemsWithCodes]);

      // Visible filter: by owner (keep ancestor summaries) + by collapse (hide descendants of collapsed summaries)
      const visibleRows = useMemo(() => {
        // 1) ownership pass
        let keepIds = new Set(enriched.map((r) => r.id));
        if (v.owner !== "all") {
          const team = teams.find((t) => t.id === v.owner);
          const matchOwner = team
            ? (r) => team.members.includes(r.owner) || (r.collaborators || []).some((o) => team.members.includes(o))
            : (r) => r.owner === v.owner || (r.collaborators || []).includes(v.owner);
          keepIds = new Set();
          enriched.forEach((r, i) => {
            if (!r.isSummary && matchOwner(r)) {
              keepIds.add(r.id);
              // add ancestors
              let lvl = r.level;
              for (let j = i - 1; j >= 0; j--) {
                if (enriched[j].level < lvl) {
                  keepIds.add(enriched[j].id);
                  lvl = enriched[j].level;
                  if (lvl === 1) break;
                }
              }
            }
          });
        }
        // 2) collapse pass — drop descendants of collapsed summaries
        const out = [];
        let collapseAtLevel = null; // if set, drop items whose level > this
        enriched.forEach((r) => {
          if (collapseAtLevel != null && r.level > collapseAtLevel) return; // hidden inside collapsed subtree
          if (collapseAtLevel != null && r.level <= collapseAtLevel) {
            collapseAtLevel = null;
          }
          if (!keepIds.has(r.id)) return;
          out.push(r);
          if (r.isSummary && collapsed[r.id]) collapseAtLevel = r.level;
        });
        return out;
      }, [enriched, v.owner, collapsed, teams]);

      const rowIndex = useMemo(() => {
        const m = {};
        visibleRows.forEach((r, i) => { m[r.id] = i; });
        return m;
      }, [visibleRows]);

      const timelineW = viewTotalDays * dayW;
      const todayMidnight = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
      const todayDayIdx = Math.round((todayMidnight - viewStart) / DAY);
      const todayX = todayDayIdx * dayW + (zoom === "month1" ? Math.floor(dayW / 2) : 0);

      const [hover, setHover] = useState(null);
      const [focusId, setFocusId] = useState(null);
      const [selectedDep, setSelectedDep] = useState(null); // {fromId, toId} or null
      const [depMenu, setDepMenu] = useState(null); // {x, y, fromId, toId}
      const [pendingDelete, setPendingDelete] = useState(null); // {id, name, childCount}

      const [ctxMenu, setCtxMenu] = useState(null); // { id, x, y } | null

      // ------- mutating actions -------
      const updateItem = useCallback((id, patch) => {
        setItems((items) => items.map((it) => it.id === id ? { ...it, ...patch } : it));
        dirtyIdsRef.current.add(id);
      }, []);

      const updateItemSegment = useCallback((id, segIdx, patch) => {
        setItems(items => items.map(it => {
          if (it.id !== id) return it;
          const newSegs = [...(it.segments || [{ start: it.start, end: it.end }])];
          newSegs[segIdx] = { ...newSegs[segIdx], ...patch };
          const allStarts = newSegs.map(s => s.start.getTime());
          const allEnds = newSegs.map(s => s.end.getTime());
          return { ...it, segments: newSegs, start: new Date(Math.min(...allStarts)), end: new Date(Math.max(...allEnds)) };
        }));
        dirtyIdsRef.current.add(id);
      }, []);

      const addSegment = useCallback((id) => {
        setItems(items => items.map(it => {
          if (it.id !== id) return it;
          const segs = it.segments || [{ start: it.start, end: it.end }];
          const lastSeg = segs.reduce((a, b) => a.end > b.end ? a : b);
          const firstDur = Math.max(3, dayDiff(segs[0].start, segs[0].end));
          const newStart = addDays(lastSeg.end, 7);
          const newEnd = addDays(newStart, firstDur);
          const newSegs = [...segs, { start: newStart, end: newEnd }];
          return { ...it, segments: newSegs, end: newEnd };
        }));
        dirtyIdsRef.current.add(id);
      }, []);

      const deleteSegment = useCallback((id, segIdx) => {
        setItems(items => items.map(it => {
          if (it.id !== id) return it;
          const segs = it.segments || [{ start: it.start, end: it.end }];
          if (segs.length <= 1) return it;
          const newSegs = segs.filter((_, i) => i !== segIdx);
          const allStarts = newSegs.map(s => s.start.getTime());
          const allEnds = newSegs.map(s => s.end.getTime());
          return { ...it, segments: newSegs, start: new Date(Math.min(...allStarts)), end: new Date(Math.max(...allEnds)) };
        }));
        dirtyIdsRef.current.add(id);
      }, []);

      // Move a subtree (item at fromIdx + descendants) to before targetIdx in the items array.
      // levelDelta: shift level of every item in the subtree by this amount (clamped 1..3).
      const moveSubtree = useCallback((sourceId, targetIdx, levelDelta = 0) => {
        setItems((items) => {
          const fromIdx = items.findIndex((x) => x.id === sourceId);
          if (fromIdx < 0) return items;
          const [s, e] = subtreeRange(items, fromIdx);
          const block = items.slice(s, e + 1).map((it) => ({
            ...it,
            level: Math.max(1, Math.min(3, it.level + levelDelta))
          }));
          block.forEach(it => dirtyIdsRef.current.add(it.id));
          const rest = items.slice(0, s).concat(items.slice(e + 1));
          let insertAt = targetIdx;
          if (targetIdx > e) insertAt = targetIdx - block.length;
          insertAt = Math.max(0, Math.min(rest.length, insertAt));
          return rest.slice(0, insertAt).concat(block, rest.slice(insertAt));
        });
      }, []);

      // New leaf task added at end of list, level 1.
      const addNewTask = useCallback((afterId) => {
        const id = `new-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        const firstOwner = Object.keys(owners)[0] ?? null;
        setItems((items) => {
          if (!afterId) {
            return [...items, {
              id, level: 1, name: "New task", owner: currentUser || firstOwner || null, collaborators: [],
              start: addDays(TODAY, 1), end: addDays(TODAY, 8), pct: 0,
              segments: [{ start: addDays(TODAY, 1), end: addDays(TODAY, 8) }], notes: "",
            }];
          }

          const idx = items.findIndex((it) => it.id === afterId);
          if (idx < 0) return items;

          const row = items[idx];
          const level = Math.min(row.level + 1, 3);
          const parentIsSummary = hasChildrenAfter(items, idx);
          const parentOwner = row.owner && owners[row.owner] ? row.owner : null;
          const newOwner = parentIsSummary ? null : (currentUser || parentOwner || firstOwner || null);

          const [, subEnd] = subtreeRange(items, idx);
          const next = [...items];
          next.splice(subEnd + 1, 0, {
            id, level, name: "New task", owner: newOwner, collaborators: [],
            start: addDays(TODAY, 1), end: addDays(TODAY, 8), pct: 0,
            segments: [{ start: addDays(TODAY, 1), end: addDays(TODAY, 8) }], notes: "",
          });
          return next;
        });
        setFocusId(id);
        dirtyIdsRef.current.add(id);
      }, [owners, setFocusId]);

      // Add a dependency (toId depends on fromId), avoiding self/duplicate.
      const addDep = useCallback((fromId, toId) => {
        if (!fromId || !toId || fromId === toId) return;
        setItems((items) => items.map((it) => {
          if (it.id !== toId) return it;
          const deps = it.deps || [];
          if (deps.includes(fromId)) return it;
          return { ...it, deps: [...deps, fromId] };
        }));
        dirtyIdsRef.current.add(toId);
      }, []);

      const removeDep = useCallback((fromId, toId) => {
        setItems((items) => items.map((it) => {
          if (it.id !== toId) return it;
          return { ...it, deps: (it.deps || []).filter((x) => x !== fromId) };
        }));
        dirtyIdsRef.current.add(toId);
      }, []);

      // 태스크 삭제 (하위 subtree 전체 + 해당 id를 참조하는 deps도 정리)
      const deleteItem = useCallback((id) => {
        setItems((items) => {
          const idx = items.findIndex((it) => it.id === id);
          if (idx < 0) return items;
          const [start, end] = subtreeRange(items, idx);
          const deletedIds = new Set(items.slice(start, end + 1).map((it) => it.id));
          deletedIds.forEach(did => { deletedIdsRef.current.add(did); dirtyIdsRef.current.delete(did); });
          return items
            .filter((_, i) => i < start || i > end)
            .map((it) => ({ ...it, deps: (it.deps || []).filter((d) => !deletedIds.has(d)) }));
        });
        setFocusId((f) => (f === id ? null : f));
      }, [setFocusId]);

      // Delete-key + Esc handling for selected dependency / focused row
      useEffect(() => {
        const onKey = (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if ((e.key === "Delete" || e.key === "Backspace") && selectedDep) {
            e.preventDefault();
            removeDep(selectedDep.fromId, selectedDep.toId);
            setSelectedDep(null);
          } else if (e.key === "Delete" && focusId) {
            e.preventDefault();
            const row = enriched.find(r => r.id === focusId);
            if (row) setPendingDelete({ id: focusId, name: row.name, childCount: row.isSummary ? (row.leafCount || 0) : 0 });
          } else if (e.key === "Escape") {
            setSelectedDep(null);
            setDepMenu(null);
            setFocusId(null);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [selectedDep, focusId, removeDep, deleteItem, enriched]);

      // Click outside dep arrow / context menu to clear
      useEffect(() => {
        if (!selectedDep && !depMenu) return;
        const onDown = (e) => {
          if (e.target.closest("[data-dep-path]") || e.target.closest("[data-dep-menu]")) return;
          setSelectedDep(null);
          setDepMenu(null);
        };
        window.addEventListener("mousedown", onDown);
        return () => window.removeEventListener("mousedown", onDown);
      }, [selectedDep, depMenu]);

      // Toggle collapse on a summary.
      const toggleCollapsed = useCallback((id) => {
        setCollapsed((c) => ({ ...c, [id]: !c[id] }));
      }, []);

      // ------- bar drag (move / resize-left / resize-right) -------
      // While dragging, we maintain a `dragPreview` to show ghost without thrashing the items array.
      const [dragPreview, setDragPreview] = useState(null); // {id, segIdx, start, end}

      const startBarDrag = useCallback((e, row, mode, segIdx = 0) => {
        e.stopPropagation();
        e.preventDefault();
        if (row.isSummary) return;

        const segs = row.segments || [{ start: row.start, end: row.end }];
        const seg = segs[segIdx] || segs[0];
        const startClientX = e.clientX;
        const origStart = seg.start;
        const origEnd = seg.end;

        function onMove(ev) {
          const dx = ev.clientX - startClientX;
          const ddays = Math.round(dx / dayW);
          let ns = origStart, ne = origEnd;
          if (mode === "move") { ns = addDays(origStart, ddays); ne = addDays(origEnd, ddays); }
          else if (mode === "l") { ns = addDays(origStart, ddays); if (dayDiff(ns, ne) < 1) ns = addDays(ne, -1); }
          else if (mode === "r") { ne = addDays(origEnd, ddays); if (dayDiff(ns, ne) < 1) ne = addDays(ns, 1); }
          setDragPreview({ id: row.id, segIdx, start: ns, end: ne });
        }
        function onUp(ev) {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          const dx = ev.clientX - startClientX;
          const ddays = Math.round(dx / dayW);
          if (ddays !== 0) {
            let ns = origStart, ne = origEnd;
            if (mode === "move") { ns = addDays(origStart, ddays); ne = addDays(origEnd, ddays); }
            else if (mode === "l") { ns = addDays(origStart, ddays); if (dayDiff(ns, ne) < 1) ns = addDays(ne, -1); }
            else if (mode === "r") { ne = addDays(origEnd, ddays); if (dayDiff(ns, ne) < 1) ne = addDays(ns, 1); }
            updateItemSegment(row.id, segIdx, { start: ns, end: ne });
          }
          setDragPreview(null);
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }, [dayW, updateItemSegment]);

      // ------- dep drag -------
      const [depDrag, setDepDrag] = useState(null); // {fromId, fromX, fromY, x, y, hitId}
      const scrollWrapRef = useRef(null);
      const headerScrollRef = useRef(null);
      const panMovedRef = useRef(false);
      const dirtyIdsRef = useRef(new Set());
      const deletedIdsRef = useRef(new Set());

      const startDepDrag = useCallback((e, row) => {
        e.stopPropagation();
        e.preventDefault();
        if (row.isSummary) return;
        const fromX = dayDiff(viewStart, row.end) * dayW;
        const fromY = rowIndex[row.id] * rowH + rowH / 2;
        setDepDrag({ fromId: row.id, fromX, fromY, x: fromX, y: fromY, hitId: null });

        function clientToContent(ev) {
          const wrap = scrollWrapRef.current;
          if (!wrap) return { x: 0, y: 0 };
          const rect = wrap.getBoundingClientRect();
          return {
            x: ev.clientX - rect.left + wrap.scrollLeft,
            y: ev.clientY - rect.top
          };
        }
        function onMove(ev) {
          const pt = clientToContent(ev);
          // hit-test: which row index? which item?
          const ri = Math.floor(pt.y / rowH);
          let hit = null;
          if (ri >= 0 && ri < visibleRows.length) {
            const r = visibleRows[ri];
            if (!r.isSummary && r.id !== row.id) {
              const rx = dayDiff(viewStart, r.start) * dayW;
              const rw = dayDiff(r.start, r.end) * dayW;
              if (pt.x >= rx - 4 && pt.x <= rx + rw + 4) hit = r.id;
            }
          }
          setDepDrag({ fromId: row.id, fromX, fromY, x: pt.x, y: pt.y, hitId: hit });
        }
        function onUp(ev) {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          // Find last hit
          setDepDrag((cur) => {
            if (cur && cur.hitId) addDep(row.id, cur.hitId);
            return null;
          });
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }, [rowIndex, dayW, rowH, visibleRows, addDep]);

      // ------- pan timeline -------
      const startPan = useCallback((e) => {
        if (e.button !== 0) return;
        const wrap = scrollWrapRef.current;
        if (!wrap) return;
        const startX = e.clientX;
        const startScroll = wrap.scrollLeft;
        panMovedRef.current = false;
        e.preventDefault();
        document.body.style.cursor = "grabbing";
        function onMove(ev) {
          if (Math.abs(ev.clientX - startX) > 3) panMovedRef.current = true;
          const next = startScroll - (ev.clientX - startX);
          wrap.scrollLeft = next;
          if (headerScrollRef.current) headerScrollRef.current.scrollLeft = next;
        }
        function onUp() {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          document.body.style.cursor = "";
          if (!panMovedRef.current) setFocusId(null);
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }, []);

      // ------- row reorder drag (any gap + level change) -------
      const [rowDrag, setRowDrag] = useState(null);
      // shape: { sourceId, sourceLevel, targetGap: {visibleIndex, itemsIdx}, targetLevel, valid }

      const startRowDrag = useCallback((e, row) => {
        e.preventDefault();
        e.stopPropagation();
        const items_ = items;
        const fromIdx = items_.findIndex((x) => x.id === row.id);
        if (fromIdx < 0) return;
        const [s, e2] = subtreeRange(items_, fromIdx);
        const sourceLevel = items_[fromIdx].level;
        const block = items_.slice(s, e2 + 1);
        const blockMaxLevel = Math.max(...block.map((b) => b.level));
        // max root level such that deepest descendant stays ≤ 3
        const maxRootLevel = 3 - (blockMaxLevel - sourceLevel);
        const rest = items_.slice(0, s).concat(items_.slice(e2 + 1));
        const startClientX = e.clientX;

        setRowDrag({
          sourceId: row.id, sourceLevel,
          targetGap: null, targetLevel: sourceLevel, valid: false
        });

        function onMove(ev) {
          const leftList = document.getElementById("__wbs_left_list__");
          if (!leftList) return;
          const rect = leftList.getBoundingClientRect();
          const yInside = ev.clientY - rect.top;

          // visibleGap index 0..N
          let gIdx = Math.round(yInside / rowH);
          gIdx = Math.max(0, Math.min(visibleRows.length, gIdx));

          // desired level = sourceLevel + delta-X / 14px
          // (intuitive: vertical-only drag preserves level; right +14 = demote; left -14 = promote)
          const dx = ev.clientX - startClientX;
          let dLevel = sourceLevel + Math.round(dx / 14);
          dLevel = Math.max(1, Math.min(3, dLevel));
          dLevel = Math.min(dLevel, maxRootLevel);

          // Compute itemsIdx for this visible gap.
          const itemsIdx = visibleGapToItemsIndex(items_, visibleRows, gIdx);

          // Validate. Don't allow dropping inside source's own subtree.
          let valid = !(itemsIdx > s && itemsIdx <= e2 + 1);

          // Strict nesting: when dLevel > 1, the previous row in `rest` (after removal) at level dLevel-1 must exist immediately as ancestor.
          if (valid && dLevel > 1) {
            let restInsertIdx = itemsIdx;
            if (itemsIdx > e2) restInsertIdx = itemsIdx - (e2 - s + 1);
            restInsertIdx = Math.max(0, Math.min(rest.length, restInsertIdx));
            let parent = null;
            for (let i = restInsertIdx - 1; i >= 0; i--) {
              if (rest[i].level < dLevel) { parent = rest[i]; break; }
            }
            valid = !!parent && parent.level < dLevel;
          }

          setRowDrag((cur) => cur ? {
            ...cur,
            targetGap: { visibleIndex: gIdx, itemsIdx },
            targetLevel: dLevel,
            valid
          } : cur);
        }

        function onUp() {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          setRowDrag((cur) => {
            if (cur && cur.targetGap && cur.valid) {
              const delta = cur.targetLevel - sourceLevel;
              const targetIdx = cur.targetGap.itemsIdx;
              // Auto-expand any collapsed ancestors of the new insertion point
              // so the moved row never lands inside a collapsed subtree.
              let restIdx = targetIdx;
              if (targetIdx > e2) restIdx = targetIdx - (e2 - s + 1);
              restIdx = Math.max(0, Math.min(rest.length, restIdx));
              const ancestors = [];
              let curLevel = 999;
              for (let i = restIdx - 1; i >= 0; i--) {
                if (rest[i].level < curLevel) {
                  ancestors.push(rest[i].id);
                  curLevel = rest[i].level;
                  if (curLevel === 1) break;
                }
              }
              if (ancestors.length) {
                setCollapsed((c) => {
                  const next = { ...c };
                  ancestors.forEach((aid) => { delete next[aid]; });
                  return next;
                });
              }
              moveSubtree(cur.sourceId, targetIdx, delta);
            }
            return null;
          });
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }, [items, visibleRows, rowH, moveSubtree]);

      // Stats
      const stats = useMemo(() => {
        const leaves = enriched.filter((r) => !r.isSummary);
        const total = leaves.length;
        const done = leaves.filter((r) => r.pct === 100).length;
        const inflight = leaves.filter((r) => r.pct > 0 && r.pct < 100).length;
        const overall = total === 0 ? 0 : Math.round(leaves.reduce((s, r) => s + (isNaN(r.pct) ? 0 : r.pct), 0) / total);
        return { total, done, inflight, overall, summaries: enriched.length - total };
      }, [enriched]);

      const ownerTaskCounts = useMemo(() => {
        const map = {};
        enriched.filter((r) => !r.isSummary).forEach((r) => {
          if (r.owner) map[r.owner] = (map[r.owner] || 0) + 1;
          (r.collaborators || []).forEach((id) => { map[id] = (map[id] || 0) + 1; });
        });
        return map;
      }, [enriched]);

      const allOwners = useMemo(() => ({ ...owners, ...vendors }), [owners, vendors]);
      const allTeams = useMemo(() => {
        const vKeys = Object.keys(vendors);
        if (vKeys.length === 0) return teams;
        return [...teams, { id: "VENDOR_TEAM", name: "Vendor", members: vKeys }];
      }, [teams, vendors]);

      return (
        <OwnersCtx.Provider value={{ owners: allOwners, teams: allTeams, ownerTaskCounts, totalLeaves: stats.total }}>
          <div>
            <Masthead stats={stats} meta={meta} updateMeta={updateMeta} projStart={projStart} projEnd={projEnd} />
            <Toolbar v={v} zoom={zoom} isAdmin={isAdmin} currentUser={currentUser} setTweak={setTweak} onExport={exportJSON} onImport={importJSON} saveStatus={saveStatus} onSave={saveToServer} isHTTP={isHTTP} isLocal={isLocal} isGitHubPages={isGitHubPages} serverOnline={serverOnline} lastSavedAt={lastSavedAt} onTeam={() => setShowTeamModal(true)} onVendor={() => setShowVendorModal(true)}
              onResetPat={() => { localStorage.removeItem('__gh_pat__' + (currentUser || '')); saveToServer(); }}
              onFixAllBaselines={() => {
                setItems(prev => prev.map(it => (!it.isSummary && it.start && it.end) ? { ...it, baseStart: it.start, baseEnd: it.end } : it));
                dirtyIdsRef.current = new Set(items.filter(it => !it.isSummary && it.start && it.end).map(it => it.id));
              }} />
            <div style={{
              background: "var(--paper-2)",
              border: "1px solid var(--line)",
              borderRadius: 4,
              boxShadow: "0 1px 0 rgba(28,25,22,0.04), 0 24px 60px -40px rgba(28,25,22,0.18)"
            }}>
              <GanttGrid
                rows={visibleRows}
                rowIndex={rowIndex}
                dayW={dayW}
                rowH={rowH}
                leftW={leftW}
                timelineW={timelineW}
                viewStart={viewStart}
                viewEnd={viewEnd}
                viewTotalDays={viewTotalDays}
                todayX={todayX}
                v={v}
                hover={hover}
                setHover={setHover}
                focusId={focusId}
                setFocusId={setFocusId}
                collapsed={collapsed}
                toggleCollapsed={toggleCollapsed}
                startBarDrag={startBarDrag}
                startDepDrag={startDepDrag}
                startRowDrag={startRowDrag}
                startPan={startPan}
                dragPreview={dragPreview}
                depDrag={depDrag}
                rowDrag={rowDrag}
                scrollWrapRef={scrollWrapRef}
                headerScrollRef={headerScrollRef}
                removeDep={removeDep}
                selectedDep={selectedDep}
                setSelectedDep={setSelectedDep}
                depMenu={depMenu}
                setDepMenu={setDepMenu}
                addNewTask={addNewTask}
                updateItem={updateItem}
                updateItemSegment={updateItemSegment}
                deleteItem={deleteItem}
                setPendingDelete={setPendingDelete}
                setCtxMenu={setCtxMenu}
                deleteSegment={deleteSegment}
                currentUser={currentUser}
                isAdmin={isAdmin}
                allRows={enriched} />

            </div>
            <Footer enriched={enriched} />
            {showTeamModal && <TeamModal owners={owners} teams={teams} onSave={updateTeamData} onClose={() => setShowTeamModal(false)} />}
            {showVendorModal && <VendorModal vendors={vendors} onSave={updateVendorData} onClose={() => setShowVendorModal(false)} />}
            {pendingDelete && (
              <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }}
                onClick={() => setPendingDelete(null)}>
                <div style={{
                  background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 6,
                  boxShadow: "0 16px 40px -10px rgba(0,0,0,0.4)", padding: "28px 32px", minWidth: 320, maxWidth: 420
                }}
                  onClick={(e) => e.stopPropagation()}>
                  <div className="serif" style={{ fontSize: 17, color: "var(--ink)", marginBottom: 8 }}>태스크 삭제</div>
                  <div className="mono" style={{ fontSize: 12, color: "var(--ink-2)", marginBottom: 6, wordBreak: "break-word" }}>
                    <strong>"{pendingDelete.name}"</strong>
                  </div>
                  {pendingDelete.childCount > 0 && (
                    <div className="mono" style={{ fontSize: 11, color: "var(--accent)", marginBottom: 12 }}>
                      하위 {pendingDelete.childCount}개 태스크도 함께 삭제됩니다.
                    </div>
                  )}
                  <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 20 }}>이 작업은 되돌릴 수 없습니다.</div>
                  <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                    <button onClick={() => setPendingDelete(null)} style={{
                      padding: "6px 16px", borderRadius: 3, border: "1px solid var(--line-2)",
                      background: "var(--paper-2)", color: "var(--ink-2)", fontSize: 12,
                      fontFamily: "IBM Plex Mono, monospace", cursor: "pointer"
                    }}>취소</button>
                    <button onClick={() => { deleteItem(pendingDelete.id); setPendingDelete(null); }} style={{
                      padding: "6px 16px", borderRadius: 3, border: "1px solid #c44b3d",
                      background: "#c44b3d", color: "#fff", fontSize: 12,
                      fontFamily: "IBM Plex Mono, monospace", cursor: "pointer"
                    }}>삭제</button>
                  </div>
                </div>
              </div>
            )}
            {ctxMenu && (
              <React.Fragment>
                <div style={{ position: "fixed", inset: 0, zIndex: 199 }} onClick={() => setCtxMenu(null)} onContextMenu={(e) => { e.preventDefault(); setCtxMenu(null); }} />
                <div style={{
                  position: "fixed", left: ctxMenu.x, top: ctxMenu.y, zIndex: 200,
                  background: "var(--paper-2)", border: "1px solid var(--line)",
                  borderRadius: 4, boxShadow: "0 8px 20px -6px rgba(0,0,0,0.25)",
                  padding: 4, minWidth: 160,
                }}>
                  <button
                    onClick={() => { addSegment(ctxMenu.id); setCtxMenu(null); }}
                    style={{
                      display: "flex", alignItems: "center", gap: 8, width: "100%",
                      padding: "6px 10px", border: "none", background: "transparent",
                      color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace",
                      fontSize: 11.5, cursor: "pointer", borderRadius: 2, textAlign: "left",
                      letterSpacing: "0.04em",
                    }}
                    onMouseEnter={(e) => e.currentTarget.style.background = "var(--paper-3)"}
                    onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
                  >＋ 구간 추가</button>
                </div>
              </React.Fragment>
            )}
          </div>
        </OwnersCtx.Provider>);

    }

    // ====================================================================
    //                           MASTHEAD / TOOLBAR
    // ====================================================================
    // 마스트헤드 전용 인라인 편집 필드 (클릭 한 번으로 편집)
    function MetaField({ value, onCommit, textStyle, inputStyle }) {
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(value);
      useEffect(() => { setVal(value); }, [value]);

      const commit = () => {
        setEditing(false);
        const v = (val || "").trim();
        if (v && v !== value) onCommit(v);
        else setVal(value);
      };

      if (editing) {
        return (
          <input
            autoFocus
            type="text"
            value={val}
            onChange={(e) => setVal(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === "Enter") { e.preventDefault(); commit(); }
              if (e.key === "Escape") { setVal(value); setEditing(false); }
            }}
            style={{ ...textStyle, ...inputStyle, border: "none", borderBottom: "2px solid var(--accent)", background: "transparent", outline: "none", padding: 0, margin: 0, width: "100%", minWidth: 80 }}
          />
        );
      }
      return (
        <span
          onClick={() => setEditing(true)}
          title="클릭해서 편집"
          style={{ ...textStyle, cursor: "text", borderBottom: "1px dashed transparent", transition: "border-color 120ms" }}
          onMouseEnter={(e) => e.currentTarget.style.borderBottomColor = "var(--accent)"}
          onMouseLeave={(e) => e.currentTarget.style.borderBottomColor = "transparent"}
        >{value}</span>
      );
    }

    function Masthead({ stats, meta, updateMeta, projStart, projEnd }) {
      const totalDays = projStart && projEnd ? dayDiff(projStart, projEnd) : 0;
      return (
        <header style={{ marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", borderBottom: "1px solid var(--ink)", paddingBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
              <span className="mono small-caps" style={{ color: "var(--ink-3)" }}>Today</span>
              <span className="serif" style={{ fontSize: 26, lineHeight: 1, color: "var(--ink)", letterSpacing: "-0.005em" }}>
                {`${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][TODAY.getDay()]}, ${monthName(TODAY.getMonth())} ${TODAY.getDate()}, ${TODAY.getFullYear()}`}
              </span>
            </div>
            {/* 프로젝트 기간 */}
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em" }}>Project</span>
              <input
                type="date"
                value={meta.projectStart || ""}
                onChange={(e) => updateMeta({ projectStart: e.target.value })}
                style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 12, color: "var(--ink-2)", background: "transparent", border: "none", borderBottom: "1px solid var(--line-2)", outline: "none", padding: "2px 4px", cursor: "pointer" }}
                onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                onBlur={(e) => e.target.style.borderColor = "var(--line-2)"}
              />
              <span className="mono" style={{ color: "var(--ink-4)", fontSize: 12 }}>→</span>
              <input
                type="date"
                value={meta.projectEnd || ""}
                onChange={(e) => updateMeta({ projectEnd: e.target.value })}
                style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 12, color: "var(--ink-2)", background: "transparent", border: "none", borderBottom: "1px solid var(--line-2)", outline: "none", padding: "2px 4px", cursor: "pointer" }}
                onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                onBlur={(e) => e.target.style.borderColor = "var(--line-2)"}
              />
              {totalDays > 0 && <span className="mono" style={{ fontSize: 10.5, color: "var(--ink-4)" }}>{totalDays}d</span>}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", alignItems: "end", marginTop: 16, gap: 24 }}>
            <div>
              <h1 className="serif" style={{ fontSize: 56, lineHeight: 1.0, margin: 0, letterSpacing: "-0.02em", color: "var(--ink)", display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
                <MetaField value={meta.wbsPrefix} onCommit={(v) => updateMeta({ wbsPrefix: v })}
                  textStyle={{ fontSize: 56, fontFamily: "Instrument Serif, Georgia, serif", letterSpacing: "-0.02em", color: "var(--ink)" }} />
                <span style={{ fontStyle: "italic", color: "var(--accent)" }}>—</span>
                <MetaField value={meta.wbsSuffix} onCommit={(v) => updateMeta({ wbsSuffix: v })}
                  textStyle={{ fontSize: 56, fontFamily: "Instrument Serif, Georgia, serif", letterSpacing: "-0.02em", color: "var(--ink)" }} />
              </h1>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, auto)", gap: 24, paddingBottom: 6 }}>
              <Stat label="Leaves" value={stats.total} />
              <Stat label="Summaries" value={stats.summaries} />
              <Stat label="Shipped" value={stats.done} />
              <Stat label="Overall" value={`${stats.overall}%`} accent />
            </div>
          </div>

        </header>);

    }

    function Stat({ label, value, accent }) {
      return (
        <div style={{ textAlign: "right", borderRight: "1px solid var(--line-2)", paddingRight: 24 }}>
          <div className="serif" style={{ fontSize: 38, lineHeight: 1, color: accent ? "var(--accent)" : "var(--ink)" }}>{value}</div>
          <div className="mono small-caps" style={{ color: "var(--ink-3)", marginTop: 4 }}>{label}</div>
        </div>);

    }

    function SaveIndicator({ status, onSave, isHTTP, isLocal, isGitHubPages, serverOnline, lastSavedAt, onResetPat }) {
      const isDirty = status === 'dirty';
      const offline = isLocal && !serverOnline;
      const dot =
        offline ? "#6b7280" :

    // ====================================================================
    //                       SEGMENT FILL HELPER
    // ====================================================================
    function computeSegFill(segments, segIdx, pct) {
      const sorted = segments
        .map((s, i) => ({ s, i }))
        .sort((a, b) => a.s.start - b.s.start);
      const totalDays = sorted.reduce((sum, { s }) => sum + Math.max(1, dayDiff(s.start, s.end)), 0);
      if (totalDays === 0) return 0;
      const fillDays = (pct / 100) * totalDays;
      let acc = 0;
      for (const { s, i } of sorted) {
        const dur = Math.max(1, dayDiff(s.start, s.end));
        if (i === segIdx) {
          const rem = fillDays - acc;
          if (rem <= 0) return 0;
          if (rem >= dur) return 1;
          return rem / dur;
        }
        acc += dur;
      }
      return 0;
    }
