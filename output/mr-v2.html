                          </button>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </div>
            </React.Fragment>
          )}
        </span>
      );
    }

    function OwnersPicker({ values, onChange }) {
      const { owners: ctxOwners, teams: ctxTeams } = React.useContext(OwnersCtx);
      const [open, setOpen] = useState(false);
      const [dropPos, setDropPos] = useState(null);
      const triggerRef = React.useRef(null);

      const handleToggleOpen = (e) => {
        e.stopPropagation();
        if (!open && triggerRef.current) {
          const rect = triggerRef.current.getBoundingClientRect();
          const spaceBelow = window.innerHeight - rect.bottom;
          const right = window.innerWidth - rect.right;
          if (spaceBelow < 320) {
            setDropPos({ bottom: window.innerHeight - rect.top + 4, right });
          } else {
            setDropPos({ top: rect.bottom + 4, right });
          }
        }
        setOpen((x) => !x);
      };

      const internalTeams = ctxTeams.filter((t) => t.id !== "VENDOR_TEAM");
      const allMembers = internalTeams.flatMap((t) => t.members).filter((m) => ctxOwners[m]);

      const toggle = (id) => {
        if (values.includes(id)) onChange(values.filter((x) => x !== id));
        else onChange([...values, id]);
      };

      const toggleTeam = (team) => {
        const valid = team.members.filter((m) => ctxOwners[m]);
        const allSel = valid.every((m) => values.includes(m));
        if (allSel) onChange(values.filter((v) => !valid.includes(v)));
        else { const s = new Set(values); valid.forEach((m) => s.add(m)); onChange([...s]); }
      };

      const toggleAll = () => {
        const allSel = allMembers.every((m) => values.includes(m));
        if (allSel) onChange([]);
        else onChange([...allMembers]);
      };

      const visible = values.slice(0, 3);
      const extra = values.length - 3;

      const teamState = (team) => {
        const valid = team.members.filter((m) => ctxOwners[m]);
        const cnt = valid.filter((m) => values.includes(m)).length;
        return cnt === valid.length && cnt > 0 ? "all" : cnt > 0 ? "some" : "none";
      };
      const allState = allMembers.every((m) => values.includes(m)) && allMembers.length > 0 ? "all"
        : allMembers.some((m) => values.includes(m)) ? "some" : "none";

      const displayLabel = (() => {
        if (values.length === 0) return null;
        if (allMembers.length > 0 && values.length === allMembers.length && allMembers.every((m) => values.includes(m))) return "ALL";
        for (const t of ctxTeams) {
          const valid = t.members.filter((m) => ctxOwners[m]);
          if (valid.length > 1 && valid.length === values.length && valid.every((m) => values.includes(m))) return t.name;
        }
        return null;
      })();

      const groupBtnStyle = (state) => ({
        display: "flex", alignItems: "center", gap: 6, width: "100%",
        padding: "5px 8px", border: "none", borderRadius: 2, cursor: "pointer",
        fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, letterSpacing: "0.04em",
        textTransform: "uppercase", textAlign: "left",
        background: state !== "none" ? "rgba(138,58,31,0.10)" : "transparent",
        color: state !== "none" ? "var(--accent)" : "var(--ink-3)",
      });

      return (
        <span
          ref={triggerRef}
          onMouseDown={(e) => e.stopPropagation()}
          onClick={handleToggleOpen}
          style={{ position: "relative", display: "inline-flex", alignItems: "center", cursor: "pointer" }}>
          {displayLabel ? (
            <span style={{
              height: 22, padding: "0 7px", borderRadius: 3,
              background: "var(--ink)", color: "var(--paper)",
              display: "flex", alignItems: "center",
              fontSize: 9, fontWeight: 700, fontFamily: "IBM Plex Mono, monospace",
              letterSpacing: "0.08em", textTransform: "uppercase",
            }}>{displayLabel}</span>
          ) : (
            <span style={{ display: "flex", alignItems: "center" }}>
              {values.length === 0
                ? <span style={{ width: 22, height: 22, borderRadius: "50%", border: "1.5px dashed var(--ink-4)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "var(--ink-4)" }}>+</span>
                : visible.map((id, i) => (
                  <span key={id} style={{ marginLeft: i > 0 ? -7 : 0, zIndex: visible.length - i, position: "relative" }}>
                    <Avatar owner={ctxOwners[id]} initials={id} />
                  </span>
                ))
              }
              {extra > 0 && (
                <span style={{ marginLeft: -7, zIndex: 0, width: 22, height: 22, borderRadius: "50%", background: "var(--paper-3)", border: "1.5px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8.5, fontWeight: 700, color: "var(--ink-3)", fontFamily: "IBM Plex Mono, monospace" }}>
                  +{extra}
                </span>
              )}
            </span>
          )}
          {open && (
            <React.Fragment>
              <div
                onMouseDown={(e) => { e.stopPropagation(); setOpen(false); }}
                onClick={(e) => { e.stopPropagation(); setOpen(false); }}
                style={{ position: "fixed", inset: 0, zIndex: 99 }} />
              <div
                onMouseDown={(e) => e.stopPropagation()}
                onClick={(e) => e.stopPropagation()}
                style={{
                  position: "fixed", ...dropPos,
                  background: "var(--paper-2)", border: "1px solid var(--line)",
                  borderRadius: 4, boxShadow: "0 12px 30px -8px rgba(0,0,0,0.25)",
                  zIndex: 200, padding: 4, minWidth: 210, maxHeight: 320, overflowY: "auto",
                }}>

                {/* ALL row */}
                <button onClick={toggleAll} style={groupBtnStyle(allState)}
                  onMouseEnter={(e) => { if (allState === "none") e.currentTarget.style.background = "var(--paper-3)"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.background = allState !== "none" ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                  <span style={{ width: 22, height: 22, borderRadius: "50%", background: allState !== "none" ? "var(--accent)" : "transparent", border: allState === "none" ? "1.5px solid var(--line-2)" : "none", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 700, color: allState !== "none" ? "var(--paper)" : "var(--ink-3)", flexShrink: 0 }}>ALL</span>
                  {allState === "all" && <span style={{ marginLeft: "auto" }}>✓</span>}
                  {allState === "some" && <span style={{ marginLeft: "auto", opacity: 0.5 }}>—</span>}
                </button>

                <div style={{ height: 1, background: "var(--line)", margin: "4px 4px" }} />

                {ctxTeams.map((team) => {
                  const ts = teamState(team);
                  return (
                    <React.Fragment key={team.id}>
                      <button onClick={() => toggleTeam(team)} style={groupBtnStyle(ts)}
                        onMouseEnter={(e) => { if (ts === "none") e.currentTarget.style.background = "var(--paper-3)"; }}
                        onMouseLeave={(e) => { e.currentTarget.style.background = ts !== "none" ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                        <span style={{ padding: "0 5px", height: 14, borderRadius: 2, background: ts !== "none" ? "var(--accent)" : "transparent", border: ts === "none" ? "1px solid var(--line-2)" : "none", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 700, color: ts !== "none" ? "var(--paper)" : "var(--ink-3)", flexShrink: 0, letterSpacing: "0.04em", textTransform: "uppercase" }}>{team.name}</span>
                        {ts === "all" && <span style={{ marginLeft: "auto" }}>✓</span>}
                        {ts === "some" && <span style={{ marginLeft: "auto", opacity: 0.5 }}>—</span>}
                      </button>
                      {team.members.map((k) => {
                        const o2 = ctxOwners[k];
                        if (!o2) return null;
                        const active = values.includes(k);
                        return (
                          <button key={k}
                            onClick={() => toggle(k)}
                            style={{
                              display: "flex", alignItems: "center", gap: 8, width: "100%",
                              padding: "4px 8px 4px 22px", border: "none",
                              background: active ? "rgba(138,58,31,0.10)" : "transparent",
                              color: "var(--ink-2)", fontFamily: "inherit", fontSize: 12,
                              cursor: "pointer", borderRadius: 2, textAlign: "left",
                            }}
                            onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--paper-3)"; }}
                            onMouseLeave={(e) => { e.currentTarget.style.background = active ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                            <Avatar owner={o2} initials={k} />
                            <span>{o2.name}</span>
                            <span className="mono" style={{ marginLeft: "auto", color: "var(--ink-4)", fontSize: 10 }}>{o2.role}</span>
                            {active && <span style={{ color: "var(--accent)", fontSize: 11, lineHeight: 1 }}>✓</span>}
                          </button>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </div>
            </React.Fragment>
          )}
        </span>
      );
    }

    // ── 태스크 상세 카드 ──────────────────────────────────────────────────────────
    function TaskDetailCard({ item, rows, onClose, onSave, canEdit, isAdmin, onSetBaseline, onClearBaseline }) {
      const toInputDate = (dt) => {
        if (!(dt instanceof Date)) return '';
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };
      const singleSeg = !item.isSummary && (!item.segments || item.segments.length <= 1);
      const multiSeg  = !item.isSummary && item.segments && item.segments.length > 1;

      const [notes, setNotes] = useState(item.notes || "");
      const [editStart, setEditStart] = useState(toInputDate(item.start));
      const [editEnd, setEditEnd]     = useState(toInputDate(item.end));
      const [editSegs, setEditSegs]   = useState(
        (item.segments || []).map(s => ({ start: toInputDate(s.start), end: toInputDate(s.end) }))
      );
      const [editPct, setEditPct]     = useState(item.pct ?? 0);
      const [editOwner, setEditOwner] = useState(item.owner || null);
      const [editCollabs, setEditCollabs] = useState(item.collaborators || []);
      const [editMilestones, setEditMilestones] = useState(
        (item.milestones || []).map(ms => ({ date: toInputDate(ms.date), label: ms.label || '' }))
      );
      const [saved, setSaved] = useState(false);

      const handleSave = () => {
        const patch = { notes, pct: editPct, owner: editOwner, collaborators: editCollabs };
        patch.milestones = editMilestones.filter(ms => ms.date).map(ms => ({
          date: new Date(ms.date + 'T00:00:00'), label: ms.label,
        }));
        if (singleSeg) {
          patch.start = editStart ? new Date(editStart + 'T00:00:00') : item.start;
          patch.end   = editEnd   ? new Date(editEnd   + 'T00:00:00') : item.end;
        } else if (multiSeg) {
          patch.segments = editSegs.map(s => ({
            start: s.start ? new Date(s.start + 'T00:00:00') : null,
            end:   s.end   ? new Date(s.end   + 'T00:00:00') : null,
          }));
        }
        onSave(patch);
        setSaved(true);
        setTimeout(() => setSaved(false), 1800);
      };

      const rootColor = rootInfo(item.code || "").color;
      const dur = editStart && editEnd
        ? dayDiff(new Date(editStart + 'T00:00:00'), new Date(editEnd + 'T00:00:00'))
        : 0;

      const dateInput = {
        fontFamily: "IBM Plex Mono, monospace", fontSize: 12,
        color: "var(--ink-2)", background: "var(--paper)",
        border: "1px solid var(--line-2)", borderRadius: 3,
        outline: "none", padding: "4px 7px", cursor: "pointer",
      };
      const labelStyle = { fontSize: 10.5, color: "var(--ink-3)", letterSpacing: "0.07em" };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }}
          onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: "var(--paper-2)", border: "1px solid var(--line)", borderRadius: 6,
              boxShadow: "0 24px 60px -16px rgba(0,0,0,0.3)", width: 440,
              display: "flex", flexDirection: "column", overflow: "hidden" }}>

            {/* Header */}
            <div style={{ padding: "16px 20px 14px", borderBottom: "1px solid var(--line)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <span className="mono" style={{ fontSize: 11, color: rootColor, fontWeight: 700, letterSpacing: 0.5,
                  background: rootColor + "22", border: "1.5px solid " + rootColor + "55", padding: "2px 7px", borderRadius: 3, flexShrink: 0 }}>{item.code}</span>
              </div>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                <div style={{ width: 3, borderRadius: 2, background: rootColor, alignSelf: "stretch", flexShrink: 0, marginTop: 2 }} />
                <span className="serif" style={{ fontSize: 20, flex: 1, letterSpacing: "-0.01em", color: "var(--ink)", lineHeight: 1.25 }}>{item.name}</span>
                <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", fontSize: 16, padding: 4, flexShrink: 0, lineHeight: 1 }}>✕</button>
              </div>
            </div>

            {/* Edit fields */}
            <div style={{ padding: "16px 20px", display: "grid", gridTemplateColumns: "68px 1fr", rowGap: 14, columnGap: 14, alignItems: "center" }}>

              {/* 기간 — 단일 세그먼트 리프이고 canEdit인 경우만 편집 */}
              <span className="mono small-caps" style={labelStyle}>기간</span>
              {singleSeg && canEdit ? (
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  <input type="date" value={editStart} onChange={(e) => setEditStart(e.target.value)}
                    style={dateInput}
                    onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                    onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                  <span style={{ color: "var(--ink-4)", fontSize: 11 }}>→</span>
                  <input type="date" value={editEnd} onChange={(e) => setEditEnd(e.target.value)}
                    style={dateInput}
                    onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                    onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                  {dur > 0 && <span className="mono" style={{ color: "var(--ink-4)", fontSize: 11 }}>{dur}d</span>}
                </div>
              ) : (
                <span style={{ fontSize: 13, color: "var(--ink-2)", display: "flex", alignItems: "baseline", gap: 6 }}>
                  <span>{item.start ? fmtDate(item.start) : "—"}</span>
                  <span style={{ color: "var(--ink-4)", fontSize: 11 }}>→</span>
                  <span>{item.end ? fmtDate(item.end) : "—"}</span>
                  {dur > 0 && <span className="mono" style={{ marginLeft: 4, color: "var(--ink-4)", fontSize: 11 }}>{dur}d</span>}
                </span>
              )}

              {/* 마일스톤 핀 */}
              {!item.isSummary && (
                <React.Fragment>
                  <span className="mono small-caps" style={{ ...labelStyle, alignSelf: "flex-start", paddingTop: 4 }}>마일스톤</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {editMilestones.map((ms, idx) => (
                      <div key={idx} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <div style={{ width: 8, height: 8, background: rootColor, transform: "rotate(45deg)", flexShrink: 0 }} />
                        <input type="date" value={ms.date} onChange={(e) => { const n = [...editMilestones]; n[idx] = { ...n[idx], date: e.target.value }; setEditMilestones(n); }}
                          style={{ ...dateInput, opacity: canEdit ? 1 : 0.6 }} readOnly={!canEdit}
                          onFocus={(e) => e.target.style.borderColor = "var(--accent)"} onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                        <input type="text" placeholder="이름" value={ms.label} onChange={(e) => { const n = [...editMilestones]; n[idx] = { ...n[idx], label: e.target.value }; setEditMilestones(n); }}
                          style={{ ...dateInput, flex: 1, opacity: canEdit ? 1 : 0.6 }} readOnly={!canEdit}
                          onFocus={(e) => e.target.style.borderColor = "var(--accent)"} onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                        {canEdit && (
                          <button onClick={() => setEditMilestones(editMilestones.filter((_, j) => j !== idx))}
                            style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-4)", fontSize: 13, padding: "0 2px", lineHeight: 1 }}
                            onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"} onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</button>
                        )}
                      </div>
                    ))}
                    {canEdit && (
                      <button onClick={() => setEditMilestones([...editMilestones, { date: '', label: '' }])}
                        style={{ alignSelf: "flex-start", background: "none", border: "1px dashed var(--line-2)", borderRadius: 3, cursor: "pointer", color: "var(--ink-3)", fontSize: 11, padding: "3px 10px", fontFamily: "IBM Plex Mono, monospace", letterSpacing: "0.06em" }}>
                        + 추가
                      </button>
                    )}
                  </div>
                </React.Fragment>
              )}

              {/* 진행률 — 리프이고 canEdit인 경우만 편집 */}
              <span className="mono small-caps" style={labelStyle}>진행률</span>
              {!item.isSummary && canEdit ? (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input type="range" min="0" max="100" step="5" value={editPct}
                    onChange={(e) => setEditPct(Number(e.target.value))}
                    style={{ flex: 1, maxWidth: 120, accentColor: rootColor, cursor: "pointer" }} />
                  <input type="number" min="0" max="100" step="5" value={editPct}
                    onChange={(e) => setEditPct(Math.max(0, Math.min(100, Number(e.target.value) || 0)))}
                    style={{ ...dateInput, width: 52, textAlign: "right" }}
                    onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                    onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                  <span className="mono" style={{ fontSize: 12, color: "var(--ink-3)" }}>%</span>
                </div>
              ) : (
                <span style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{ flex: 1, maxWidth: 130, height: 5, background: "var(--line)", borderRadius: 3, overflow: "hidden" }}>
                    <span style={{ display: "block", height: "100%", width: `${item.pct}%`, background: rootColor, borderRadius: 3 }} />
                  </span>
                  <span className="mono" style={{ fontSize: 12, color: "var(--ink-2)", minWidth: 32 }}>{item.pct}%</span>
                </span>
              )}

              {/* 담당자 (단일) */}
              <span className="mono small-caps" style={{ ...labelStyle, alignSelf: "flex-start", paddingTop: 6 }}>담당자</span>
              {isAdmin
                ? <OwnerSinglePicker value={editOwner} onChange={setEditOwner} hasCollabs={false} />
                : <OwnerSinglePicker value={editOwner} onChange={null} hasCollabs={false} />}

              {/* 협력자 (다중) */}
              <span className="mono small-caps" style={{ ...labelStyle, alignSelf: "flex-start", paddingTop: 6 }}>협력자</span>
              {canEdit
                ? <OwnersPicker values={editCollabs} onChange={setEditCollabs} excludeOwner={editOwner} />
                : <span style={{ fontSize: 13, color: "var(--ink-3)" }}>{editCollabs.length > 0 ? editCollabs.join(", ") : "—"}</span>}

              {/* 구간 — 멀티 세그먼트 */}
              {multiSeg && (
                <React.Fragment>
                  <span className="mono small-caps" style={{ ...labelStyle, alignSelf: "flex-start", paddingTop: 2 }}>구간</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {canEdit ? editSegs.map((seg, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        <span className="mono" style={{ fontSize: 11, color: "var(--ink-4)", minWidth: 16 }}>{i + 1}.</span>
                        <input type="date" value={seg.start} onChange={(e) => { const ns = [...editSegs]; ns[i] = { ...ns[i], start: e.target.value }; setEditSegs(ns); }}
                          style={dateInput} onFocus={(e) => e.target.style.borderColor = "var(--accent)"} onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                        <span style={{ color: "var(--ink-4)", fontSize: 11 }}>→</span>
                        <input type="date" value={seg.end} onChange={(e) => { const ns = [...editSegs]; ns[i] = { ...ns[i], end: e.target.value }; setEditSegs(ns); }}
                          style={dateInput} onFocus={(e) => e.target.style.borderColor = "var(--accent)"} onBlur={(e) => e.target.style.borderColor = "var(--line-2)"} />
                      </div>
                    )) : item.segments.map((seg, i) => (
                      <span key={i} className="mono" style={{ fontSize: 12, color: "var(--ink-3)" }}>
                        {i + 1}. {seg.start ? fmtDate(seg.start) : "—"} → {seg.end ? fmtDate(seg.end) : "—"}
                      </span>
                    ))}
                  </div>
                </React.Fragment>
              )}

              {/* 선행업무 read-only */}
              {item.deps && item.deps.length > 0 && (
                <React.Fragment>
                  <span className="mono small-caps" style={{ ...labelStyle, alignSelf: "flex-start", paddingTop: 2 }}>선행업무</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {item.deps.map((depId) => {
                      const dep = (rows || []).find((r) => r.id === depId);
                      const depColor = dep ? rootInfo(dep.code || "").color : "var(--ink-4)";
                      return dep ? (
                        <span key={depId} style={{ display: "flex", alignItems: "center", gap: 7 }}>
                          <span className="mono" style={{ fontSize: 11, color: depColor, fontWeight: 700, letterSpacing: 0.3 }}>{dep.code}</span>
                          <span style={{ fontSize: 13, color: "var(--ink-2)" }}>{dep.name}</span>
                        </span>
                      ) : (
                        <span key={depId} className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>{depId}</span>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
            </div>

            {/* Baseline */}
            {!item.isSummary && canEdit && (
              <div style={{ padding: "10px 20px", borderTop: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)", letterSpacing: "0.07em", fontFamily: "IBM Plex Mono, monospace", textTransform: "uppercase", flexShrink: 0 }}>기준선</div>
                {item.baseStart && item.baseEnd ? (
                  <React.Fragment>
                    <span style={{ fontSize: 12, color: "var(--ink-3)", fontFamily: "IBM Plex Mono, monospace" }}>
                      {fmtDate(item.baseStart)} → {fmtDate(item.baseEnd)}
                    </span>
                    <button onClick={() => { onSetBaseline(); }}
                      style={{ marginLeft: "auto", border: "1px solid var(--line-2)", padding: "4px 10px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                      재고정
                    </button>
                    <button onClick={() => { onClearBaseline(); }}
                      style={{ border: "1px solid var(--line-2)", padding: "4px 10px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-4)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                      초기화
                    </button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <span style={{ fontSize: 12, color: "var(--ink-4)" }}>미설정</span>
                    <button onClick={() => { onSetBaseline(); }}
                      style={{ marginLeft: "auto", border: "1px solid var(--line-2)", padding: "4px 10px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                      현재 날짜로 고정
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}

            {/* Notes */}
            <div style={{ padding: "0 20px 20px", borderTop: "1px solid var(--line)" }}>
              <div className="mono small-caps" style={{ fontSize: 10.5, color: "var(--ink-3)", letterSpacing: "0.07em", margin: "12px 0 6px" }}>비고</div>
              <textarea
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="메모를 입력하세요..."
                style={{
                  width: "100%", minHeight: 80, resize: "vertical", boxSizing: "border-box",
                  background: "var(--paper)", border: "1px solid var(--line-2)", borderRadius: 3,
                  padding: "8px 10px", fontFamily: "IBM Plex Sans, sans-serif",
                  fontSize: 12.5, color: "var(--ink)", outline: "none", lineHeight: 1.5,
                }}
                onFocus={(e) => e.target.style.borderColor = "var(--accent)"}
                onBlur={(e) => e.target.style.borderColor = "var(--line-2)"}
              />
            </div>

            {/* Footer */}
            <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 8, padding: "12px 20px", borderTop: "1px solid var(--line)" }}>
              {saved && <span className="mono" style={{ fontSize: 10.5, color: "var(--accent)", marginRight: "auto" }}>저장됨 ✓</span>}
              {!canEdit && <span className="mono" style={{ fontSize: 10.5, color: "var(--ink-4)", marginRight: "auto" }}>읽기 전용</span>}
              <button onClick={onClose} style={{ border: "1px solid var(--line-2)", padding: "6px 14px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>닫기</button>
              {canEdit && <button onClick={handleSave} style={{ border: "1px solid var(--ink)", padding: "6px 14px", borderRadius: 3, background: "var(--ink)", color: "var(--paper)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>저장</button>}
            </div>
          </div>
        </div>
      );
    }

    // ── 팀원 편집 모달 ────────────────────────────────────────────────────────
    const TINT_PALETTE = [
      "var(--accent)", "var(--rose)", "var(--olive)", "var(--plum)", "var(--slate)", "var(--clay)",
      "#5b8c5a", "#6b4e71", "#3d7a8a", "#8a6a3d",
    ];

    function TeamModal({ owners, teams, onSave, onClose }) {
      const [eo, setEo] = useState(() => JSON.parse(JSON.stringify(owners)));
      const [et, setEt] = useState(() => teams.map((t) => ({ ...t, members: [...t.members] })));
      const [renames, setRenames] = useState({});

      const updOwner = (id, patch) => setEo((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));

      const renameOwner = (oldId, newId) => {
        newId = newId.trim();
        if (!newId || newId === oldId) return;
        if (eo[newId]) return;
        setRenames((prev) => {
          const n = { ...prev };
          const origKey = Object.keys(n).find((k) => n[k] === oldId) ?? oldId;
          if (origKey === newId) delete n[origKey];
          else n[origKey] = newId;
          return n;
        });
        setEo((prev) => { const n = { ...prev, [newId]: { ...prev[oldId] } }; delete n[oldId]; return n; });
        setEt((prev) => prev.map((t) => ({ ...t, members: t.members.map((m) => m === oldId ? newId : m) })));
      };

      const delOwner = (id) => {
        setEo((prev) => { const n = { ...prev }; delete n[id]; return n; });
        setEt((prev) => prev.map((t) => ({ ...t, members: t.members.filter((m) => m !== id) })));
      };

      const addOwner = (teamId) => {
        const used = new Set(Object.values(eo).map((o) => o.tint));
        const tint = TINT_PALETTE.find((c) => !used.has(c)) || TINT_PALETTE[0];
        const id = "M" + Date.now().toString(36).slice(-4).toUpperCase();
        setEo((prev) => ({ ...prev, [id]: { name: "", team: teamId, role: "", tint } }));
        setEt((prev) => prev.map((t) => t.id === teamId ? { ...t, members: [...t.members, id] } : t));
      };

      const updTeam = (teamId, patch) => setEt((prev) => prev.map((t) => t.id === teamId ? { ...t, ...patch } : t));

      const addTeam = () => {
        const id = "T" + Date.now().toString(36).slice(-4).toUpperCase();
        setEt((prev) => [...prev, { id, name: "새 팀", members: [] }]);
      };

      const delTeam = (teamId) => {
        const members = et.find((t) => t.id === teamId)?.members || [];
        setEo((prev) => { const n = { ...prev }; members.forEach((m) => delete n[m]); return n; });
        setEt((prev) => prev.filter((t) => t.id !== teamId));
      };

      const handleSave = () => {
        const cleaned = Object.fromEntries(Object.entries(eo).filter(([, o]) => o.name.trim()));
        const cleanedTeams = et
          .filter((t) => t.name.trim())
          .map((t) => ({ ...t, members: t.members.filter((m) => cleaned[m]) }));
        onSave(cleaned, cleanedTeams, renames);
        onClose();
      };

      const inputStyle = {
        border: "none", borderBottom: "1px solid var(--line-2)",
        background: "transparent", outline: "none",
        fontFamily: "IBM Plex Sans, sans-serif", color: "var(--ink)", padding: "2px 0",
      };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: "var(--paper-2)", border: "1px solid var(--line)", borderRadius: 6,
            boxShadow: "0 24px 60px -16px rgba(0,0,0,0.3)", width: 460,
            maxHeight: "80vh", display: "flex", flexDirection: "column", overflow: "hidden",
          }}>
            {/* Header */}
            <div style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: "1px solid var(--line)" }}>
              <span className="serif" style={{ fontSize: 20, flex: 1, letterSpacing: "-0.01em", color: "var(--ink)" }}>팀원 관리</span>
              <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", fontSize: 15, padding: 4 }}>✕</button>
            </div>

            {/* Body */}
            <div style={{ overflowY: "auto", flex: 1, padding: "8px 20px 20px" }}>
              {et.map((team) => (
                <div key={team.id} style={{ marginTop: 18 }}>
                  <div className="mono small-caps" style={{ fontSize: 10.5, color: "var(--ink-3)", marginBottom: 8, display: "flex", alignItems: "center", gap: 8, letterSpacing: "0.1em" }}>
                    <input
                      value={team.name}
                      onChange={(e) => updTeam(team.id, { name: e.target.value })}
                      style={{
                        background: "transparent", border: "none", borderBottom: "1px solid var(--line-2)",
                        outline: "none", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5,
                        color: "var(--ink-3)", letterSpacing: "0.1em", textTransform: "uppercase",
                        padding: "0 0 1px", minWidth: 0, width: `${Math.max((team.name || "").length, 4)}ch`,
                      }}
                    />
                    <span style={{ flex: 1, height: 1, background: "var(--line-2)" }} />
                    <span>{team.members.filter((m) => eo[m]).length}</span>
                    <span onClick={() => delTeam(team.id)}
                      style={{ cursor: "pointer", color: "var(--ink-4)", fontSize: 10, lineHeight: 1 }}
                      onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"}
                      onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</span>
                  </div>
                  {/* Column headers */}
                  <div style={{ display: "grid", gridTemplateColumns: "26px 42px 1fr 90px 24px", gap: 8, padding: "0 0 5px", borderBottom: "1px solid var(--line-2)" }}>
                    {["", "ID", "이름", "직무", ""].map((h, i) => (
                      <span key={i} className="mono small-caps" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: "0.08em" }}>{h}</span>
                    ))}
                  </div>
                  {/* Member rows */}
                  {team.members.filter((m) => eo[m]).map((id) => {
                    const o = eo[id];
                    return (
                      <div key={id} style={{ display: "grid", gridTemplateColumns: "26px 42px 1fr 90px 24px", gap: 8, alignItems: "center", padding: "5px 0" }}>
                        <span style={{ width: 22, height: 22, borderRadius: "50%", background: o.tint, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: "var(--paper)", flexShrink: 0, fontFamily: "IBM Plex Mono, monospace" }}>{id.slice(0, 2)}</span>
                        <input
                          defaultValue={id}
                          onFocus={(e) => e.target.select()}
                          onBlur={(e) => renameOwner(id, e.target.value)}
                          style={{ fontSize: 10, fontFamily: "IBM Plex Mono, monospace", color: "var(--ink-3)", background: "transparent", border: "none", borderBottom: "1px solid transparent", outline: "none", width: "100%", padding: "1px 0" }}
                          onMouseEnter={(e) => e.target.style.borderBottomColor = "var(--line-2)"}
                          onMouseLeave={(e) => { if (document.activeElement !== e.target) e.target.style.borderBottomColor = "transparent"; }}
                          onFocusCapture={(e) => e.target.style.borderBottomColor = "var(--accent)"}
                          onBlurCapture={(e) => e.target.style.borderBottomColor = "transparent"}
                        />
                        <input value={o.name} onChange={(e) => updOwner(id, { name: e.target.value })} placeholder="이름" style={{ ...inputStyle, fontSize: 13 }} />
                        <input value={o.role} onChange={(e) => updOwner(id, { role: e.target.value })} placeholder="직무" style={{ ...inputStyle, fontSize: 11, fontFamily: "IBM Plex Mono, monospace", color: "var(--ink-3)" }} />
                        <span onClick={() => delOwner(id)} style={{ cursor: "pointer", color: "var(--ink-4)", fontSize: 11, textAlign: "center", borderRadius: 2, lineHeight: "22px" }}
                          onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"}
                          onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</span>
                      </div>
                    );
                  })}
                  {/* Add member button */}
                  <button onClick={() => addOwner(team.id)} style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", cursor: "pointer", color: "var(--ink-4)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, padding: "4px 0", letterSpacing: "0.05em" }}
                    onMouseEnter={(e) => e.currentTarget.style.color = "var(--accent)"}
                    onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>
                    <span style={{ fontSize: 14, lineHeight: 1 }}>+</span> {team.name}에 팀원 추가
                  </button>
                </div>
              ))}

              {/* Add team button */}
              <button onClick={addTeam} style={{
                marginTop: 20, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                width: "100%", padding: "7px 0", background: "none",
                border: "1px dashed var(--line-2)", borderRadius: 3, cursor: "pointer",
                color: "var(--ink-4)", fontFamily: "IBM Plex Mono, monospace", fontSize: 10.5, letterSpacing: "0.05em",
              }}
                onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--accent)"; e.currentTarget.style.color = "var(--accent)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--line-2)"; e.currentTarget.style.color = "var(--ink-4)"; }}>
                <span style={{ fontSize: 14, lineHeight: 1 }}>+</span> 새 팀 추가
              </button>
            </div>

            {/* Footer */}
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "12px 20px", borderTop: "1px solid var(--line)" }}>
              <button onClick={onClose} style={{ border: "1px solid var(--line-2)", padding: "6px 14px", borderRadius: 3, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>취소</button>
              <button onClick={handleSave} style={{ border: "1px solid var(--ink)", padding: "6px 14px", borderRadius: 3, background: "var(--ink)", color: "var(--paper)", fontFamily: "IBM Plex Mono, monospace", fontSize: 11, cursor: "pointer", letterSpacing: "0.06em", textTransform: "uppercase" }}>저장</button>
            </div>
          </div>
        </div>
      );
    }

    // 리액트 엔트리 영역 위쪽에 배치해 주세요. vendormodal 추가
    const VENDOR_PALETTE = ["#5b8c5a", "#3d7a8a", "#8a6a3d", "var(--slate)", "var(--clay)", "var(--plum)", "var(--rose)", "var(--olive)", "var(--accent)"];

    function VendorModal({ vendors, onSave, onClose }) {
      const [ev, setEv] = useState(() => JSON.parse(JSON.stringify(vendors)));
      const [renames, setRenames] = useState({});

      const updVendor = (id, patch) => setEv((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));

      const renameVendor = (oldId, newId) => {
        newId = newId.trim().toUpperCase();
        if (!newId || newId === oldId || ev[newId]) return;
        setRenames((prev) => ({ ...prev, [oldId]: newId }));
        setEv((prev) => { const n = { ...prev, [newId]: { ...prev[oldId] } }; delete n[oldId]; return n; });
      };

      const delVendor = (id) => {
        setEv((prev) => { const n = { ...prev }; delete n[id]; return n; });
      };

      const addVendor = () => {
        const used = new Set(Object.values(ev).map((v) => v.tint));
        const tint = VENDOR_PALETTE.find((c) => !used.has(c)) || VENDOR_PALETTE[0];
        const id = "V" + Date.now().toString(36).slice(-3).toUpperCase();
        setEv((prev) => ({ ...prev, [id]: { name: "", role: "", tint } }));
      };

      const handleSave = () => {
        const cleaned = Object.fromEntries(Object.entries(ev).filter(([, v]) => v.name.trim()));
        onSave(cleaned, renames);
        onClose();
      };

      const inputStyle = { border: "none", borderBottom: "1px solid var(--line-2)", background: "transparent", outline: "none", fontFamily: "inherit", color: "var(--ink)", padding: "4px 0", width: "100%" };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(28,25,22,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }} onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "var(--paper-2)", border: "1px solid var(--line)", borderRadius: 6, boxShadow: "0 24px 60px -16px rgba(0,0,0,0.3)", width: 460, maxHeight: "75vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <div style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: "1px solid var(--line)" }}>
              <span className="serif" style={{ fontSize: 20, flex: 1, color: "var(--ink)" }}>🏭 외주사/공급사 관리</span>
              <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", fontSize: 15 }}>✕</button>
            </div>
            <div style={{ overflowY: "auto", flex: 1, padding: "20px" }}>
              <div style={{ display: "grid", gridTemplateColumns: "26px 50px 1fr 110px 24px", gap: 10, paddingBottom: 6, borderBottom: "1px solid var(--line)" }}>
                {["", "코드", "회사명", "담당 업무/품목", ""].map((h, i) => (
                  <span key={i} className="mono small-caps" style={{ fontSize: 10, color: "var(--ink-4)", letterSpacing: "0.05em" }}>{h}</span>
                ))}
              </div>
              {Object.entries(ev).map(([id, v]) => (
                <div key={id} style={{ display: "grid", gridTemplateColumns: "26px 50px 1fr 110px 24px", gap: 10, alignItems: "center", padding: "6px 0", borderBottom: "1px dashed var(--line-2)" }}>
                  <span style={{
                    width: 22, height: 22, borderRadius: 4, background: v.tint,
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    color: "var(--paper)", fontFamily: "IBM Plex Mono, monospace",
                    fontSize: 8, fontWeight: 700, letterSpacing: 0.3,
                    overflow: "hidden", flexShrink: 0,
                  }}>{id.slice(0, 3)}</span>
                  <input defaultValue={id} onBlur={(e) => renameVendor(id, e.target.value)} style={{ ...inputStyle, fontFamily: "IBM Plex Mono", fontSize: 11, textAlign: "center" }} />
                  <input value={v.name} onChange={(e) => updVendor(id, { name: e.target.value })} placeholder="회사명 입력" style={{ ...inputStyle, fontSize: 13 }} />
                  <input value={v.role} onChange={(e) => updVendor(id, { role: e.target.value })} placeholder="예: 외장디자인" style={{ ...inputStyle, fontSize: 11, color: "var(--ink-3)" }} />
                  <span onClick={() => delVendor(id)} style={{ cursor: "pointer", color: "var(--ink-4)", fontSize: 11, textAlign: "center" }} onMouseEnter={(e) => e.currentTarget.style.color = "#c44b3d"} onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>✕</span>
                </div>
              ))}
              <button onClick={addVendor} style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 5, background: "none", border: "1px dashed var(--line-2)", borderRadius: 3, width: "100%", padding: "8px", justifyContent: "center", cursor: "pointer", color: "var(--ink-4)", fontFamily: "IBM Plex Mono", fontSize: 11 }} onMouseEnter={(e) => e.currentTarget.style.borderColor = "var(--accent)"} onMouseLeave={(e) => e.currentTarget.style.borderColor = "var(--line-2)"}>
                + 새 외주사 추가
              </button>
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "12px 20px", borderTop: "1px solid var(--line)" }}>
              <button onClick={onClose} style={{ border: "1px solid var(--line-2)", padding: "6px 14px", borderRadius: 3, background: "var(--paper)", fontSize: 11, cursor: "pointer" }}>취소</button>
              <button onClick={handleSave} style={{ border: "1px solid var(--ink)", padding: "6px 14px", borderRadius: 3, background: "var(--ink)", color: "var(--paper)", fontSize: 11, cursor: "pointer" }}>저장</button>
            </div>
          </div>
        </div>
      );
    }

    function Footer({ enriched }) {
      const { owners: ctxOwners, teams: ctxTeams } = React.useContext(OwnersCtx);

      const overdue = useMemo(() => {
        if (!enriched) return [];
        return enriched
          .filter((r) => !r.isSummary && r.pct < 100 && r.end && r.end < TODAY)
          .map((r) => ({ ...r, overdueDays: dayDiff(r.end, TODAY) }))
          .sort((a, b) => b.overdueDays - a.overdueDays);
      }, [enriched]);

      return (
        <footer style={{ marginTop: 32, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 28, paddingTop: 18, borderTop: "1px solid var(--line)" }}>
          <div>
            <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 8 }}>Work Packages</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 16px", fontSize: 12.5, color: "var(--ink-2)" }}>
              {(enriched || []).filter((r) => r.level === 1).map((r) =>
                <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 16, height: 8, background: rootInfo(r.code).color, borderRadius: 1, flexShrink: 0 }} />
                  <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{r.code}</span>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</span>
                </div>
              )}
            </div>
            <div style={{ marginTop: 14 }}>
              <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 6 }}>Interaction map</div>
              <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "4px 12px", fontSize: 11.5, color: "var(--ink-2)" }} className="mono">
                <span style={{ color: "var(--ink-4)" }}>name</span><span>click summary → collapse, double-click → edit</span>
                <span style={{ color: "var(--ink-4)" }}>avatar</span><span>click owner avatar → pick new owner</span>
                <span style={{ color: "var(--ink-4)" }}>%</span><span>click progress → type 0–100</span>
                <span style={{ color: "var(--ink-4)" }}>⋮⋮</span><span>drag row → reorder + indent to change level</span>
                <span style={{ color: "var(--ink-4)" }}>+</span><span>new task button at the bottom of list</span>
                <span style={{ color: "var(--ink-4)" }}>bar</span><span>drag middle / edges → reschedule</span>
                <span style={{ color: "var(--ink-4)" }}>○</span><span>pull from bar tail → draw dep arrow</span>
                <span style={{ color: "var(--ink-4)" }}>arrow</span><span>click + Delete (or right-click) → remove</span>
                <span style={{ color: "var(--ink-4)" }}>empty</span><span>drag background → pan timeline</span>
              </div>
            </div>
          </div>

          <div>
            <div className="mono small-caps" style={{ color: "var(--ink-3)", marginBottom: 8 }}>Team</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {ctxTeams.map((team) =>
                <div key={team.id}>
                  <div className="mono small-caps" style={{ color: "var(--ink-2)", marginBottom: 6, display: "flex", alignItems: "baseline", gap: 6 }}>
                    <span>{team.name}</span>
                    <span style={{ flex: 1, height: 1, background: "var(--line-2)" }} />
                    <span style={{ color: "var(--ink-4)" }}>{team.members.length}</span>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                    {team.members.map((k) => {
                      const o = ctxOwners[k];
                      if (!o) return null;
                      return (
                        <div key={k} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--ink-2)" }}>
                          <Avatar owner={o} initials={k} />
                          <span style={{ fontWeight: 500 }}>{o.name}</span>
                          {/* 💡 marginLeft: "auto"를 제거하고 앞에 연한 대시( - )를 추가해 붙였습니다 */}
                          <span className="mono" style={{ color: "var(--ink-4)", fontSize: 10.5 }}>- {o.role}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 지연 태스크 */}
          <div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
              <div className="mono small-caps" style={{ color: "var(--ink-3)" }}>Overdue</div>
              {overdue.length > 0 && (
                <span style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 10, color: "var(--paper)", background: "var(--accent)", borderRadius: 99, padding: "1px 6px", letterSpacing: 0.4 }}>
                  {overdue.length}
                </span>
              )}
            </div>
            {overdue.length === 0 ? (
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--ink-4)", fontSize: 12 }}>
                <span style={{ fontSize: 14 }}>✓</span>
                <span className="mono" style={{ letterSpacing: 0.3 }}>All tasks on schedule</span>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                {overdue.map((r, i) => {
                  const rootColor = rootInfo(r.code || "").color;
                  const codeParts = (r.code || "").split(".");
                  const ancestors = codeParts.slice(0, -1).map((_, idx) => {
                    const parentCode = codeParts.slice(0, idx + 1).join(".");
                    return (enriched || []).find((x) => x.code === parentCode);
                  }).filter(Boolean);
                  return (
                    <div key={r.id} style={{
                      padding: "6px 0",
                      borderBottom: i < overdue.length - 1 ? "1px dashed var(--line-2)" : "none"
                    }}>
                      {ancestors.length > 0 && (
                        <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 2 }}>
                          {ancestors.map((anc, ai) => (
                            <React.Fragment key={anc.id}>
                              {ai > 0 && <span style={{ color: "var(--ink-4)", fontSize: 9 }}>›</span>}
                              <span style={{ fontSize: 10.5, color: "var(--ink-4)" }}>{anc.name}</span>
                            </React.Fragment>
                          ))}
                        </div>
                      )}
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span className="mono" style={{ fontSize: 10, color: rootColor, fontWeight: 700, letterSpacing: 0.3, flexShrink: 0 }}>{r.code}</span>
                        <span style={{ fontSize: 12, color: "var(--ink-2)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</span>
                        <span className="mono" style={{ fontSize: 10.5, color: "var(--accent)", fontWeight: 600, whiteSpace: "nowrap" }}>+{r.overdueDays}d</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </footer>);

    }

    // ---------- mount ----------
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);  </script>
</body>

</html>
