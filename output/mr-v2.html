                    borderTop: "4px solid transparent", borderBottom: "4px solid transparent",
                    borderLeft: `8px solid ${rowDrag.valid ? "var(--accent)" : "#c44b3d"}`
                  }} />
                </div>
              }

              {/* + New task button */}
              <button
                onClick={() => addNewTask(null)}
                style={{
                  display: "flex", alignItems: "center", gap: 8,
                  width: "100%", border: "none", borderTop: "1px solid var(--line)",
                  padding: "10px 14px", background: "transparent",
                  color: "var(--ink-3)", cursor: "pointer",
                  fontFamily: "IBM Plex Mono, monospace", fontSize: 11,
                  letterSpacing: 0.5, textTransform: "uppercase", textAlign: "left"
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--paper-3)"; e.currentTarget.style.color = "var(--ink)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--ink-3)"; }}>
                <span style={{ fontSize: 16, lineHeight: 1, color: "var(--accent)" }}>+</span>
                <span>New task</span>
              </button>
            </div>
          </div>

          {/* RIGHT — header + scrollable body */}
          <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
          {/* HEADER — sticky, 가로 스크롤은 JS로 동기화 */}
          <div ref={headerScrollRef} style={{ overflowX: "hidden", overflowY: "clip", flexShrink: 0, position: "sticky", top: 0, zIndex: 20, background: "var(--paper-2)" }}>
            <div style={{ width: timelineW, position: "relative" }}>
              {/* Today marker — diamond + date label in sticky header */}
              {todayX >= 0 && <>
                <div style={{
                  position: "absolute", bottom: 2, left: todayX - 4,
                  width: 9, height: 9, background: "rgba(138,58,31,0.55)",
                  transform: "rotate(45deg)", pointerEvents: "none", zIndex: 25
                }} />
                {zoomLevel === "month12" && <div style={{
                  position: "absolute", bottom: 13, left: todayX,
                  transform: "translateX(-50%)",
                  background: "rgba(138,58,31,0.55)", color: "var(--paper)",
                  fontFamily: "IBM Plex Mono, monospace", fontSize: 9, fontWeight: 600,
                  padding: "2px 5px", borderRadius: 2, whiteSpace: "nowrap", letterSpacing: 0.4,
                  lineHeight: 1.4, pointerEvents: "none", zIndex: 25
                }}>
                  {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][TODAY.getDay()]}
                  {" "}{TODAY.getMonth() + 1}/{TODAY.getDate()}
                </div>}
              </>}
              <div style={{ height: headerH, borderBottom: "1px solid var(--line)" }}>
                <div style={{ position: "absolute", inset: 0, height: 24, borderBottom: "1px solid var(--line)" }}>
                  {months.map((m, idx) => {
                    const next = months[idx + 1];
                    const w = ((next ? next.i : viewTotalDays) - m.i) * dayW;
                    return (
                      <div key={idx} style={{
                        position: "absolute", left: m.i * dayW, width: w, height: 24,
                        display: "flex", alignItems: "center", paddingLeft: 10,
                        borderRight: "1px solid var(--line)"
                      }}>
                        <span className="serif" style={{ fontSize: 18, color: "var(--ink)" }}>{m.name}</span>
                        <span className="mono small-caps" style={{ color: "var(--ink-4)", marginLeft: 6 }}>{m.year}</span>
                      </div>);

                  })}
                </div>
                <div style={{ position: "absolute", left: 0, right: 0, top: 24, bottom: 0 }}>
                  {zoomLevel === "month12" ?
                    /* 12-month zoom: 주 경계 + 주 번호 */
                    weeks.map((w, idx) => {
                      const next = weeks[idx + 1];
                      const wpx = ((next ? next.i : viewTotalDays) - w.i) * dayW;
                      return (
                        <div key={idx} style={{
                          position: "absolute", left: w.i * dayW, width: wpx, height: "100%",
                          borderRight: "1px solid var(--line-2)",
                          display: "flex", alignItems: "center", paddingLeft: 3, overflow: "hidden"
                        }}>
                          {wpx >= 18 && <span className="mono" style={{ fontSize: 8, color: "var(--ink-4)", letterSpacing: 0.2, whiteSpace: "nowrap" }}>W{w.w}</span>}
                        </div>);
                    }) :
                    /* month1: 일 단위 셀, 주말 붉은 배경 */
                    days.map((dt, i) => {
                      const isToday = dt.getDate() === TODAY.getDate() && dt.getMonth() === TODAY.getMonth() && dt.getFullYear() === TODAY.getFullYear();
                      const isFirstOfMonth = dt.getDate() === 1;
                      const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                      return (
                        <div key={i} style={{
                          position: "absolute", left: i * dayW, width: dayW, height: "100%",
                          borderRight: isFirstOfMonth ? "1px solid var(--line)" : "1px dashed var(--line-2)",
                          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                          background: isToday ? "rgba(138,58,31,0.12)" : isWeekend ? "rgba(200,40,40,0.07)" : "transparent"
                        }}>
                          <span className="mono" style={{ fontSize: 8.5, color: isWeekend ? "rgba(200,40,40,0.7)" : "var(--ink-4)", letterSpacing: 0.4, lineHeight: 1 }}>
                            {["S", "M", "T", "W", "T", "F", "S"][dt.getDay()]}
                          </span>
                          <span className="mono" style={{
                            fontSize: 11, color: isToday ? "var(--accent)" : isWeekend ? "rgba(200,40,40,0.6)" : "var(--ink-2)",
                            fontWeight: isToday ? 600 : 400, marginTop: 1, lineHeight: 1
                          }}>{dt.getDate()}</span>
                        </div>);
                    })
                  }
                </div>
              </div>
            </div>
          </div>
          {/* BODY — 가로 스크롤 컨테이너 */}
          <div ref={scrollWrapRef} style={{ overflowX: "auto", overflowY: "visible", position: "relative" }}
            onScroll={(e) => { if (headerScrollRef.current) headerScrollRef.current.scrollLeft = e.currentTarget.scrollLeft; }}>
            <div style={{ width: timelineW, position: "relative" }}>
              {/* BODY (pan capture surface) */}
              <div
                onMouseDown={startPan}
                style={{ position: "relative", height: totalRowsHeight, cursor: depDrag ? "crosshair" : "grab" }}>

                {/* grid lines + 주말 배경 — zoom에 맞춰 */}
                {zoomLevel === "month12" ? (
                  /* month12: 주 경계 점선만 */
                  weeks.map((w, idx) =>
                    <div key={`w${idx}`} style={{
                      position: "absolute", top: 0, left: w.i * dayW, width: 1, height: totalRowsHeight,
                      backgroundImage: "repeating-linear-gradient(to bottom, var(--line-2) 0, var(--line-2) 3px, transparent 3px, transparent 6px)",
                      pointerEvents: "none"
                    }} />
                  )
                ) : (
                  /* month1: 주말 배경 + 주 경계(점선) + 월 경계(실선) */
                  <>
                    {days.map((dt, i) => {
                      const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                      if (!isWeekend) return null;
                      return <div key={`wknd${i}`} style={{
                        position: "absolute", top: 0, left: i * dayW, width: dayW, height: totalRowsHeight,
                        background: "rgba(200,40,40,0.04)", pointerEvents: "none"
                      }} />;
                    })}
                    {weeks.map((w, idx) =>
                      <div key={`w${idx}`} style={{
                        position: "absolute", top: 0, left: w.i * dayW, width: 1, height: totalRowsHeight,
                        background: "var(--line-2)", pointerEvents: "none"
                      }} />
                    )}
                    {months.map((m, idx) =>
                      <div key={`m${idx}`} style={{
                        position: "absolute", top: 0, left: m.i * dayW, width: 1, height: totalRowsHeight,
                        background: "var(--line)", pointerEvents: "none"
                      }} />
                    )}
                  </>
                )}

                {/* row tinting + separators */}
                {rows.map((r, i) => {
                  const lvl = r.level;
                  const rowColor = colorFor(r.code);
                  const levelBg = r.isSummary && lvl === 1 ? "var(--paper-3)" :
                    r.isSummary && lvl === 2 ? "rgba(232,221,198,0.35)" : null;
                  return (
                    <React.Fragment key={r.id}>
                      {levelBg &&
                        <div style={{
                          position: "absolute", top: i * rowH, left: 0, right: 0, height: rowH,
                          background: levelBg, pointerEvents: "none"
                        }} />
                      }
                      <div style={{
                        position: "absolute", top: i * rowH, left: 0, right: 0, height: rowH,
                        background: rowColor + "0c", pointerEvents: "none"
                      }} />
                      <div style={{
                        position: "absolute", left: 0, right: 0, top: (i + 1) * rowH - 1,
                        height: 1, background: "var(--line)", pointerEvents: "none"
                      }} />
                    </React.Fragment>);

                })}

                {/* dep arrows */}
                {v.showDeps &&
                  <svg style={{ position: "absolute", inset: 0, width: timelineW, height: totalRowsHeight, pointerEvents: "none", overflow: "visible" }}>
                    <defs>
                      <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
                        <path d="M0,0 L8,4 L0,8 z" fill="var(--ink-2)" />
                      </marker>
                      <marker id="arr-soft" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M0,0 L8,4 L0,8 z" fill="var(--ink-4)" />
                      </marker>
                      <marker id="arr-sel" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)" />
                      </marker>
                    </defs>
                    {rows.flatMap((r) => (r.deps || []).map((depId) => {
                      const di = rowIndex[depId];
                      const ri = rowIndex[r.id];
                      if (di == null || ri == null) return null;
                      const dep = rows[di];
                      const x1 = dayDiff(viewStart, dep.end) * dayW;
                      const y1 = di * rowH + rowH / 2;
                      const x2 = dayDiff(viewStart, r.start) * dayW;
                      const y2 = ri * rowH + rowH / 2;
                      const path = elbowPath(x1, y1, x2, y2);
                      const active = hover === r.id || hover === depId || focusId === r.id || focusId === depId;
                      const isSel = selectedDep && selectedDep.fromId === depId && selectedDep.toId === r.id;
                      return (
                        <g key={`${depId}-${r.id}`}
                          data-dep-path
                          onClick={(e) => { e.stopPropagation(); setSelectedDep({ fromId: depId, toId: r.id }); setDepMenu(null); }}
                          onContextMenu={(e) => {
                            e.preventDefault(); e.stopPropagation();
                            setSelectedDep({ fromId: depId, toId: r.id });
                            setDepMenu({ x: e.clientX, y: e.clientY, fromId: depId, toId: r.id });
                          }}
                          style={{ cursor: "pointer" }}>
                          {/* invisible wide path to make arrow easier to click */}
                          <path d={path} stroke="transparent" strokeWidth={12} fill="none" style={{ pointerEvents: "stroke" }} />
                          {/* visible path */}
                          <path d={path}
                            stroke={isSel ? "var(--accent)" : active ? "var(--ink-2)" : "var(--ink-4)"}
                            strokeWidth={isSel ? 2 : active ? 1.4 : 0.9}
                            strokeDasharray={isSel || active ? "0" : "2 3"}
                            fill="none"
                            markerEnd={isSel ? "url(#arr-sel)" : active ? "url(#arr)" : "url(#arr-soft)"}
                            opacity={isSel ? 1 : active ? 1 : 0.55}
                            style={{ pointerEvents: "none" }} />
                        </g>);

                    }))}

                    {/* selection × badge for selected dep */}
                    {selectedDep && (() => {
                      const di = rowIndex[selectedDep.fromId];
                      const ri = rowIndex[selectedDep.toId];
                      if (di == null || ri == null) return null;
                      const dep = rows[di], r = rows[ri];
                      if (!dep || !r) return null;
                      const x1 = dayDiff(viewStart, dep.end) * dayW;
                      const y1 = di * rowH + rowH / 2;
                      const x2 = dayDiff(viewStart, r.start) * dayW;
                      const y2 = ri * rowH + rowH / 2;
                      const dx = x2 - x1;
                      const mid = dx >= 24 ? x1 + Math.max(10, dx / 2) : x1 + 12;
                      const cx = mid, cy = (y1 + y2) / 2;
                      return (
                        <g
                          data-dep-path
                          onClick={(e) => {
                            e.stopPropagation();
                            removeDep(selectedDep.fromId, selectedDep.toId);
                            setSelectedDep(null);
                          }}
                          style={{ cursor: "pointer", pointerEvents: "all" }}>
                          <circle cx={cx} cy={cy} r={9} fill="var(--accent)" />
                          <path d={`M ${cx - 4} ${cy - 4} L ${cx + 4} ${cy + 4} M ${cx + 4} ${cy - 4} L ${cx - 4} ${cy + 4}`}
                            stroke="var(--paper)" strokeWidth={1.6} strokeLinecap="round" fill="none" />
                        </g>);

                    })()}

                    {/* preview line during dep drag */}
                    {depDrag &&
                      <g>
                        <path d={elbowPath(depDrag.fromX, depDrag.fromY, depDrag.x, depDrag.y)}
                          stroke="var(--accent)" strokeWidth={1.6} strokeDasharray="3 3" fill="none"
                          markerEnd="url(#arr)" />
                        {depDrag.hitId &&
                          <circle cx={depDrag.x} cy={depDrag.y} r={5} fill="var(--accent)" />
                        }
                      </g>
                    }
                  </svg>
                }

                {/* dep context menu */}
                {depMenu &&
                  <div data-dep-menu
                    style={{
                      position: "fixed", left: depMenu.x, top: depMenu.y,
                      background: "var(--paper-2)", border: "1px solid var(--line-2)",
                      borderRadius: 4, boxShadow: "0 12px 30px -10px rgba(0,0,0,0.3)",
                      zIndex: 10000, padding: 4, minWidth: 160
                    }}>
                    <button onClick={(e) => {
                      e.stopPropagation();
                      removeDep(depMenu.fromId, depMenu.toId);
                      setDepMenu(null);
                      setSelectedDep(null);
                    }} style={{
                      display: "flex", alignItems: "center", gap: 8,
                      width: "100%", border: "none", background: "transparent",
                      padding: "8px 10px", borderRadius: 3, cursor: "pointer",
                      fontSize: 12.5, color: "var(--ink)", textAlign: "left", fontFamily: "inherit"
                    }} onMouseEnter={(e) => e.currentTarget.style.background = "var(--paper-3)"}
                      onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <span style={{ color: "var(--accent)" }}>×</span>
                      <span>Delete arrow</span>
                      <span className="mono" style={{ marginLeft: "auto", color: "var(--ink-4)", fontSize: 10.5 }}>Del</span>
                    </button>
                  </div>
                }

                {/* TODAY */}
                <div style={{
                  position: "absolute", top: 0, left: todayX, width: 1, height: totalRowsHeight,
                  background: "rgba(138,58,31,0.3)", pointerEvents: "none", zIndex: 25
                }}>
                </div>

                {/* BARS */}
                {rows.map((r, i) => {
                  const color = colorFor(r.code);
                  if (r.isSummary) {
                    if (!r.start || !r.end) {
                      const barH = r.level === 1 ? 12 : 9;
                      const cy = i * rowH + rowH / 2;
                      return (
                        <div key={r.id} title="날짜 미설정" style={{
                          position: "absolute", left: 0, top: cy - barH / 2,
                          width: dayW * 3, height: barH,
                          border: "1.5px dashed var(--line-2)", borderRadius: 2,
                          opacity: 0.5, pointerEvents: "none",
                        }} />
                      );
                    }
                    const x = dayDiff(viewStart, r.start) * dayW;
                    const w = Math.max(dayW * 0.7, dayDiff(r.start, r.end) * dayW);
                    return (
                      <SummaryBar key={r.id} r={r} i={i} x={x} w={w} rowH={rowH} color={color}
                        isHover={hover === r.id} isFocus={focusId === r.id}
                        onEnter={() => setHover(r.id)} onLeave={() => setHover(null)}
                        onClick={() => setFocusId(focusId === r.id ? null : r.id)}
                        onDoubleClick={() => setDetailId(r.id)} />
                    );
                  }
                  const y = i * rowH + 5;
                  const h = rowH - 10;
                  const segs = r.segments || [{ start: r.start, end: r.end }];
                  const sortedIdx = segs
                    .map((s, idx) => ({ s, idx }))
                    .sort((a, b) => a.s.start - b.s.start);
                  const baseBar = (r.baseStart && r.baseEnd) ? (
                    <div key={`${r.id}-base`} style={{
                      position: "absolute",
                      left: dayDiff(viewStart, r.baseStart) * dayW,
                      top: y - 2,
                      width: Math.max(dayW * 0.7, dayDiff(r.baseStart, r.baseEnd) * dayW),
                      height: h + 4,
                      background: "transparent",
                      border: `2px dashed ${color}`,
                      borderRadius: 3,
                      pointerEvents: "none",
                      zIndex: 1,
                      opacity: 0.5,
                    }} />
                  ) : null;
                  const bars = sortedIdx.map(({ s: seg, idx: segIdx }, sortedPos) => {
                    const isLastSeg = sortedPos === sortedIdx.length - 1;
                    const isFirstSeg = sortedPos === 0;
                    const usePreview = dragPreview && dragPreview.id === r.id && dragPreview.segIdx === segIdx;
                    const segStart = usePreview ? dragPreview.start : seg.start;
                    const segEnd = usePreview ? dragPreview.end : seg.end;
                    if (!segStart || !segEnd) {
                      if (!isFirstSeg) return null;
                      return (
                        <div key={`${r.id}-${segIdx}-nodate`} title="날짜 미설정" style={{
                          position: "absolute", left: 0, top: y,
                          width: dayW * 3, height: h,
                          border: "1.5px dashed var(--line-2)", borderRadius: 3,
                          opacity: 0.5, pointerEvents: "none",
                        }} />
                      );
                    }
                    const x = dayDiff(viewStart, segStart) * dayW;
                    const w = Math.max(dayW * 0.7, dayDiff(segStart, segEnd) * dayW);
                    const fillFraction = computeSegFill(segs, segIdx, r.pct);
                    return (
                      <LeafBar key={`${r.id}-${segIdx}`}
                        r={r} segIdx={segIdx} totalSegs={segs.length}
                        isFirstSeg={isFirstSeg} isLastSeg={isLastSeg}
                        fillFraction={fillFraction}
                        previewStart={segStart} previewEnd={segEnd}
                        x={x} y={y} w={w} h={h} color={color}
                        isHover={hover === r.id} isFocus={focusId === r.id}
                        onEnter={() => setHover(r.id)} onLeave={() => setHover(null)}
                        onBarDown={canEdit(r) ? (e, mode) => startBarDrag(e, r, mode, segIdx) : () => {}}
                        onDepDown={(e) => startDepDrag(e, r)}
                        onDeleteSeg={canEdit(r) ? () => deleteSegment(r.id, segIdx) : null}
                        onDoubleClick={() => setDetailId(r.id)}
                        onClick={() => setFocusId(focusId === r.id ? null : r.id)}
                        isPreview={usePreview} />
                    );
                  });
                  const msPins = (r.milestones || []).map((ms, msIdx) => {
                    if (!ms.date) return null;
                    const cx = dayDiff(viewStart, ms.date) * dayW + dayW / 2;
                    return <MilestonePin key={`${r.id}-ms-${msIdx}`} cx={cx} rowH={rowH} i={i} color={color} label={ms.label} />;
                  });
                  return [baseBar, ...bars, ...msPins];
                })}
              </div>
            </div>
          </div>
          </div>
          {detailId && (() => {
            const detailItem = rows.find((r) => r.id === detailId);
            return detailItem ? <TaskDetailCard item={detailItem} rows={allRows || rows} onClose={() => setDetailId(null)}
              canEdit={canEdit(detailItem)} isAdmin={isAdmin}
              onSetBaseline={() => updateItem(detailId, { baseStart: detailItem.start, baseEnd: detailItem.end })}
              onClearBaseline={() => updateItem(detailId, { baseStart: null, baseEnd: null })}
              onSave={(patch) => {
                const { start, end, segments, ...rest } = patch;
                updateItem(detailId, rest);
                if (!detailItem.isSummary) {
                  if (segments && segments.length > 0) {
                    segments.forEach((seg, i) => updateItemSegment(detailId, i, seg));
                  } else if (start || end) {
                    updateItemSegment(detailId, 0, { start: start || detailItem.start, end: end || detailItem.end });
                  }
                }
              }} /> : null;
          })()}
        </div>);

    }

    // elbow routing: horizontal-vertical-horizontal with a small dogleg.
    // BUFFER keeps the vertical line a comfortable distance away from the arrow head.
    function elbowPath(x1, y1, x2, y2) {
      const BUFFER = 20;
      const dx = x2 - x1;
      if (Math.abs(y2 - y1) < 1) return `M ${x1} ${y1} L ${x2} ${y2}`;
      // Backtrack route when target is behind source or too tight to elbow normally
      if (dx < BUFFER + 14) {
        const downY = (y1 + y2) / 2;
        const stub = 10;
        return `M ${x1} ${y1} L ${x1 + stub} ${y1} L ${x1 + stub} ${downY} L ${x2 - BUFFER} ${downY} L ${x2 - BUFFER} ${y2} L ${x2} ${y2}`;
      }
      // Normal elbow: vertical clamped to ≥ BUFFER away from target
      const mid = Math.min(x1 + Math.max(10, dx / 2), x2 - BUFFER);
      return `M ${x1} ${y1} L ${mid} ${y1} L ${mid} ${y2} L ${x2} ${y2}`;
    }

    // ====================================================================
    //                       BARS
    // ====================================================================
    function SummaryBar({ r, i, x, w, rowH, color, isHover, isFocus, onEnter, onLeave, onClick, onDoubleClick }) {
      const lvl = r.level;
      const cy = i * rowH + rowH / 2;
      const barH = lvl === 1 ? 12 : 9;
      const fillW = w * (r.pct / 100);
      return (
        <div onMouseEnter={onEnter} onMouseLeave={onLeave}
          onMouseDown={(e) => e.stopPropagation()}
          onClick={(e) => { e.stopPropagation(); onClick(); }}
          onDoubleClick={(e) => { e.stopPropagation(); onDoubleClick(); }}
          style={{
            position: "absolute", left: x, top: cy - barH / 2, width: w, height: barH,
            cursor: "pointer", zIndex: isHover || isFocus ? 4 : 2
          }}>
          <div style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)", left: 4, width: Math.max(0, w - 8), height: 3,
            background: color, opacity: 0.45
          }} />
          <div style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)", left: 4, width: Math.max(0, fillW - 8), height: 3,
            background: color
          }} />
          {/* dot end caps */}
          <div style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)", left: -4,
            width: 8, height: 8, borderRadius: 99, background: color
          }} />
          <div style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)", right: -4,
            width: 8, height: 8, borderRadius: 99, background: color,
            opacity: r.pct >= 100 ? 1 : 0.45
          }} />

        </div>);

    }


    function LeafBar({ r, segIdx, totalSegs, isFirstSeg, isLastSeg, fillFraction,
      x, y, w, h, color, isHover, isFocus, onEnter, onLeave,
      onBarDown, onDepDown, isPreview, previewStart, previewEnd, onDeleteSeg, onDoubleClick, onClick }) {
      const fillW = (w - 2) * fillFraction;
      const handleW = 6;
      return (
        <div onMouseEnter={onEnter} onMouseLeave={onLeave}
          onMouseDown={(e) => { e.stopPropagation(); onBarDown(e, "move"); }}
          onClick={(e) => { e.stopPropagation(); onClick && onClick(); }}
          onDoubleClick={(e) => { e.stopPropagation(); onDoubleClick(); }}
          style={{
            position: "absolute", left: x, top: y, width: w, height: h,
            background: "var(--paper)",
            border: `1px solid ${color}`,
            borderRadius: 3,
            overflow: "visible",

            return (
              <React.Fragment>
                <div style={{ ...baseLabel, color: "var(--paper)", textShadow: "0 1px 0 rgba(0,0,0,0.2)", clipPath: `inset(0 ${rightClip}px 0 0)` }}>{labelContent}</div>
                <div style={{ ...baseLabel, color: "var(--ink)", clipPath: `inset(0 0 0 ${fillW}px)` }}>{labelContent}</div>

          <div onMouseDown={(e) => { e.stopPropagation(); onBarDown(e, "l"); }} title="Drag to change start"

          {/* right resize handle */}
          <div onMouseDown={(e) => { e.stopPropagation(); onBarDown(e, "r"); }} title="Drag to change end"

          {/* delete segment button — only if multiple segments, on hover */}

              title="이 구간 삭제"
              style={{
                position: "absolute", top: -7, right: -7, width: 14, height: 14,
                borderRadius: 99, background: "var(--paper-2)", border: `1px solid ${color}`,
                display: "flex", alignItems: "center", justifyContent: "center",

                position: "absolute", top: h / 2 - 4, right: -9, width: 8, height: 8,

    function Avatar({ owner, initials }) {
      if (!owner) return (
        <span style={{
          display: "inline-flex", alignItems: "center", justifyContent: "center",
          width: 22, height: 22, borderRadius: 99,
          background: "var(--line-2)", color: "var(--ink-4)",

        }}>{(initials || "?").slice(0, 2)}</span>

      return (

        }}>{initials}</span>);

    function PctChip({ pct: rawPct, editable, onChange }) {
      const pct = (rawPct == null || isNaN(rawPct)) ? 0 : Math.max(0, Math.min(100, rawPct));
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(String(pct));
      useEffect(() => { setVal(String(pct)); }, [pct]);

      const state = pct === 100 ? "done" : pct === 0 ? "queued" : "live";
      const color = state === "done" ? "var(--ok)" : state === "queued" ? "var(--ink-4)" : "var(--ink-2)";

      const commit = () => {
        let n = parseInt(val, 10);
        if (Number.isNaN(n)) n = pct;
        n = Math.max(0, Math.min(100, n));
        setEditing(false);
        if (n !== pct) onChange && onChange(n);
      };

      if (editing && editable) {
        return (
          <input
            type="number" min="0" max="100" step="5"
            value={val}
            onChange={(e) => setVal(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } else
                if (e.key === "Escape") { setVal(String(pct)); setEditing(false); }
            }}
            onClick={(e) => e.stopPropagation()}
            onMouseDown={(e) => e.stopPropagation()}
            autoFocus
            style={{
              width: 46, fontSize: 11, padding: "2px 4px",
              border: "1px solid var(--accent)", background: "var(--paper)",
              color: "var(--ink)", fontFamily: "IBM Plex Mono, monospace",
              borderRadius: 2, textAlign: "right", outline: "none"
            }} />);


      }

      const label = pct === 100 ? "100" : pct === 0 ? "—" : pct + "";
      return (
        <span
          onClick={(e) => { if (editable) { e.stopPropagation(); setEditing(true); } }}
          onMouseDown={(e) => { if (editable) e.stopPropagation(); }}
          title={editable ? "Click to edit progress" : undefined}
          className="mono"
          style={{
            fontSize: 10.5, color, letterSpacing: 0.3,
            borderLeft: "1px solid var(--line-2)", paddingLeft: 8, minWidth: 36, textAlign: "right",
            cursor: editable ? "text" : "default",
            userSelect: "none"
          }}>
          {label}{pct > 0 && pct < 100 ? "%" : ""}</span>);

    }

    function EditableText({ value, onCommit, style, multiline, suggestions }) {
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(value);
      const [activeIdx, setActiveIdx] = useState(-1);
      useEffect(() => { setVal(value); }, [value]);

      const filtered = (editing && val && suggestions)
        ? suggestions.filter((s) => s !== value && s.toLowerCase().includes(val.toLowerCase())).slice(0, 7)
        : [];

      const commit = (v) => {
        setEditing(false);
        setActiveIdx(-1);
        const trimmed = ((v !== undefined ? v : val) || "").trim();
        if (!trimmed) { setVal(value); return; }
        if (trimmed !== value) onCommit(trimmed);
        else setVal(value);
      };

      if (editing) {
        return (
          <div style={{ position: "relative", width: "100%" }}
            onMouseDown={(e) => e.stopPropagation()}
            onClick={(e) => e.stopPropagation()}>
            <input
              type="text" value={val}
              onChange={(e) => { setVal(e.target.value); setActiveIdx(-1); }}
              onBlur={() => commit()}
              onKeyDown={(e) => {
                if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx((i) => Math.min(i + 1, filtered.length - 1)); }
                else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx((i) => Math.max(i - 1, -1)); }
                else if (e.key === "Enter") {
                  e.preventDefault();
                  commit(activeIdx >= 0 && filtered[activeIdx] ? filtered[activeIdx] : undefined);
                }
                else if (e.key === "Tab" && filtered.length > 0) {
                  e.preventDefault();
                  commit(activeIdx >= 0 ? filtered[activeIdx] : filtered[0]);
                }
                else if (e.key === "Escape") { setVal(value); setEditing(false); }
                e.stopPropagation();
              }}
              autoFocus
              style={{
                ...style,
                fontSize: style && style.fontSize ? style.fontSize : 13,
                padding: "1px 4px",
                border: "1px solid var(--accent)", background: "var(--paper)",
                color: "var(--ink)", borderRadius: 2, outline: "none",
                width: "100%", boxSizing: "border-box",
              }}
            />
            {filtered.length > 0 && (
              <div style={{
                position: "absolute", top: "100%", left: 0, zIndex: 200, marginTop: 2,
                background: "var(--paper-2)", border: "1px solid var(--line)",
                borderRadius: 3, boxShadow: "0 8px 20px -6px rgba(0,0,0,0.22)",
                minWidth: "100%", whiteSpace: "nowrap",
              }}>
                {filtered.map((s, i) => (
                  <div key={s}
                    onMouseDown={(e) => { e.preventDefault(); commit(s); }}
                    onMouseEnter={() => setActiveIdx(i)}
                    onMouseLeave={() => setActiveIdx(-1)}
                    style={{
                      padding: "5px 10px", fontSize: 11.5, cursor: "pointer",
                      fontFamily: "IBM Plex Mono, monospace",
                      background: i === activeIdx ? "var(--ink)" : "transparent",
                      color: i === activeIdx ? "var(--paper)" : "var(--ink-2)",
                    }}>{s}</div>
                ))}
              </div>
            )}
          </div>
        );
      }
      return (
        <span
          onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }}
          style={{ ...style, cursor: "text", display: "block" }}
          title="Double-click to edit"
        >{value}</span>
      );
    }

    // 단일 담당자 피커 (OwnersPicker 스타일, 단일 선택)
    function OwnerSinglePicker({ value, onChange, hasCollabs }) {
      const { owners: ctxOwners, teams: ctxTeams } = React.useContext(OwnersCtx);
      const [open, setOpen] = useState(false);
      const [dropPos, setDropPos] = useState(null);
      const triggerRef = React.useRef(null);
      const o = value ? ctxOwners[value] : null;
      const tint = o?.tint || "var(--ink-4)";

      const handleOpen = (e) => {
        e.stopPropagation();
        if (!onChange) return;
        if (!open && triggerRef.current) {
          const rect = triggerRef.current.getBoundingClientRect();
          const spaceBelow = window.innerHeight - rect.bottom;
          const right = window.innerWidth - rect.right;
          setDropPos(spaceBelow < 280
            ? { bottom: window.innerHeight - rect.top + 4, right }
            : { top: rect.bottom + 4, right }
          );
        }
        setOpen(x => !x);
      };

      return (
        <span ref={triggerRef} style={{ position: "relative", display: "inline-flex", alignItems: "center", gap: 3 }}>
          <span
            onClick={handleOpen}
            title={o ? o.name : "담당자 없음"}
            style={{
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              width: 22, height: 22, borderRadius: 99,
              background: o ? tint : "var(--line)",
              color: "var(--paper)", fontSize: 9.5, fontWeight: 600, letterSpacing: 0.3,
              cursor: onChange ? "pointer" : "default",
              border: hasCollabs ? `2px solid ${tint}` : "none",
              boxSizing: "border-box",
            }} className="mono">
            {value || "—"}
          </span>
          {open && onChange && (
            <React.Fragment>
              <div onMouseDown={(e) => { e.stopPropagation(); setOpen(false); }}
                onClick={(e) => { e.stopPropagation(); setOpen(false); }}
                style={{ position: "fixed", inset: 0, zIndex: 99 }} />
              <div onMouseDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                style={{
                  position: "fixed", ...dropPos,
                  background: "var(--paper-2)", border: "1px solid var(--line)",
                  borderRadius: 4, boxShadow: "0 12px 30px -8px rgba(0,0,0,0.25)",
                  zIndex: 200, padding: 4, minWidth: 210, maxHeight: 320, overflowY: "auto",
                }}>
                <button
                  onClick={() => { onChange(null); setOpen(false); }}
                  style={{
                    display: "flex", alignItems: "center", gap: 8, width: "100%",
                    padding: "4px 8px", border: "none",
                    background: !value ? "rgba(138,58,31,0.10)" : "transparent",
                    color: "var(--ink-3)", fontFamily: "inherit", fontSize: 12,
                    cursor: "pointer", borderRadius: 2, textAlign: "left",
                  }}
                  onMouseEnter={(e) => { if (value) e.currentTarget.style.background = "var(--paper-3)"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.background = !value ? "rgba(138,58,31,0.10)" : "transparent"; }}>
                  <span style={{ width: 22, height: 22, borderRadius: 99, border: "1.5px dashed var(--ink-4)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "var(--ink-4)" }}>—</span>
                  <span>없음</span>
                  {!value && <span style={{ marginLeft: "auto", color: "var(--accent)" }}>✓</span>}
                </button>
                <div style={{ height: 1, background: "var(--line)", margin: "4px 4px" }} />
                {ctxTeams.map((team) => {
                  const members = team.members.filter(m => ctxOwners[m]);
                  if (!members.length) return null;
                  return (
                    <React.Fragment key={team.id}>
                      <div style={{ padding: "4px 8px 2px", display: "flex", alignItems: "center" }}>
                        <span style={{ padding: "0 5px", height: 14, borderRadius: 2, background: "transparent", border: "1px solid var(--line-2)", display: "flex", alignItems: "center", fontSize: 8, fontWeight: 700, color: "var(--ink-3)", letterSpacing: "0.04em", textTransform: "uppercase" }}>{team.name}</span>
                      </div>
                      {members.map((k) => {
                        const o2 = ctxOwners[k];
                        const active = value === k;
                        return (
                          <button key={k} onClick={() => { onChange(active ? null : k); setOpen(false); }}
                            style={{
                              display: "flex", alignItems: "center", gap: 8, width: "100%",
                              padding: "4px 8px 4px 22px", border: "none",
                              background: active ? "rgba(138,58,31,0.10)" : "transparent",
                              color: "var(--ink-2)", fontFamily: "inherit", fontSize: 12,
                              cursor: "pointer", borderRadius: 2, textAlign: "left",
                            }}
                            onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--paper-3)"; }}
                            onMouseLeave={(e) => { e.currentTarget.style.background = active ? "rgba(138,58,31,0.10)" : "transparent"; }}>
