name: Backup Gantt JSON

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 실행
  workflow_dispatch:       # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    concurrency:
      group: backup-json
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy JSON to backups folder
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M")
          cp output/mr-v2-gantt-state-v1.json backups/${TIMESTAMP}.json
          echo "Backed up as backups/${TIMESTAMP}.json"

      - name: Delete oldest backups (keep 720)
        run: |
          cd backups
          COUNT=$(ls -1 *.json 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 720 ]; then
            DELETE=$((COUNT - 720))
            ls -1t *.json | tail -n $DELETE | xargs rm -f
            echo "Deleted $DELETE old backup(s)"
          else
            echo "Backup count: $COUNT / 720, no deletion needed"
          fi

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Backup $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
